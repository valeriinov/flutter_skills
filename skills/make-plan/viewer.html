<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>План</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #151823;
  --ink-2: #5B6173;
  --ink-3: #3E4456;
  --blue: #3F5FD8;
  --blue-d: #2C47B3;
  --blue-l: #5577EE;
  --blue-bg: #E6ECFF;
  --blue-bg2: #F7F9FF;
  --blue-line: #C9D4FA;
  --line: #E3E6EE;
  --line-2: #D5D9E3;
  --section: #F4F5F9;
  --card: #FFFFFF;
  --loop-line: #E08A4F;
  --loop-ink: #9A4312;
  --loop-ink-2: #C2571F;
  --loop-bg: #FFF8F3;
  --loop-bg2: #FCEBDD;
  --badge: #E8EAF1;
  --danger: #B42318;
  --danger-bg: #FDE8E8;
  --highlight: rgba(255, 214, 10, 0.35);
  --highlight-border: #E0B400;
  --node-new-bg: #DAFBE1;
  --node-new-border: #1A7F37;
  --node-new-fg: #116329;
  --node-changed-bg: #DDF4FF;
  --node-changed-border: #0969DA;
  --node-changed-fg: #0550AE;
  --node-same-bg: #F6F8FA;
  --node-same-border: #D0D7DE;
  --node-same-fg: #57606A;
  --f-display: 'Unbounded', system-ui, sans-serif;
  --f-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--section);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  max-width: 792px;
  margin: 0 auto;
  padding: 24px 16px 0;
  overflow-wrap: anywhere;
}
h1, h2, h3 { line-height: 1.25; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 7.4vw, 40px); line-height: 1.15; margin: 0 0 14px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 5.4vw, 24px); margin: 32px 0 14px; }
h3 { font-family: var(--f-body); font-weight: 700; font-size: 18px; margin: 20px 0 8px; }
a { color: var(--blue); }
code { font-family: var(--f-mono); font-size: max(12px, .86em); background: var(--badge); color: var(--ink-3); padding: 1px 5px; border-radius: 6px; }
pre { background: var(--section); border: 1px solid var(--line); padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
pre code { background: none; padding: 0; color: var(--ink); }
table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
th, td { padding: 10px 12px 10px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
tbody tr:last-child td { border-bottom: none; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; margin: 12px 0; }
details[open] { border-color: var(--blue-line); padding-bottom: 12px; }
summary {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 48px; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer; list-style: none;
}
summary::-webkit-details-marker { display: none; }
summary::after {
  content: ""; flex: none; width: 8px; height: 8px; margin-right: 4px;
  border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2);
  transform: rotate(45deg); transition: transform .15s;
}
details[open] > summary::after { transform: rotate(-135deg); }
.mermaid { overflow-x: auto; text-align: center; }
.mermaid svg { max-width: 100%; height: auto; }

.eyebrow, .stage-anchor-label, .thread-head {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--blue);
}

#front-matter-strip { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.lane-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.lane-badge.lane-contained { background: var(--blue-bg); color: var(--blue-d); }
.lane-badge.lane-wide { background: var(--loop-bg2); color: var(--loop-ink-2); }
.lane-badge.lane-closed { background: var(--danger-bg); color: var(--danger); }
.fm-item { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); background: var(--badge); padding: 2px 8px; border-radius: 999px; }

#tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
#tabs button {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 999px;
  min-height: 36px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 700;
  color: var(--ink-3); cursor: pointer;
}
#tabs button:hover { background: var(--blue-bg2); }
#tabs button.active { background: var(--blue-bg); border-color: var(--blue-l); color: var(--blue-d); }

.btn-primary, #review-bar button, #select-trigger {
  min-height: 44px; padding: 10px 18px; border: none; border-radius: 14px;
  background: var(--blue-l); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
}
.btn-primary:hover, #review-bar button:hover, #select-trigger:hover { background: var(--blue); }
.btn-primary:disabled, #review-bar button:disabled { opacity: .6; cursor: default; }
.btn-ghost {
  min-height: 44px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--card); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer;
}
.btn-ghost:hover { background: var(--blue-bg2); }
.btn-sm { min-height: 36px; padding: 6px 16px; border-radius: 999px; font-size: 14px; }
.btn-text {
  min-height: 36px; padding: 6px 12px; border: none; border-radius: 999px; background: none;
  color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn-text:hover { background: var(--section); color: var(--ink); }
.link-btn { border: none; background: none; padding: 0; color: var(--blue); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.link-btn:hover { color: var(--blue-d); text-decoration: underline; }
.icon-btn {
  width: 36px; height: 36px; padding: 0; flex-shrink: 0; display: inline-grid; place-items: center;
  border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-3); cursor: pointer;
}
.icon-btn:hover { background: var(--blue-bg2); border-color: var(--blue-line); color: var(--blue-d); }
.icon-btn.recording { background: #FDE8E8; border-color: #F04438; color: #B42318; animation: rec-pulse 1.2s ease-in-out infinite; }
.icon-btn.quiet { width: 30px; height: 30px; border-color: transparent; background: transparent; color: var(--ink-2); }
.icon-btn.quiet:hover { background: var(--card); border-color: var(--line); color: var(--ink); }
.icon-btn.quiet.danger:hover { color: #B42318; border-color: #F7C1C1; background: #FFF5F5; }
@keyframes rec-pulse { 50% { box-shadow: 0 0 0 6px rgba(240, 68, 56, .15); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.recording { animation: none; } }
.form-footer { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.form-footer .spacer { flex: 1; }

.comment-form { display: flex; flex-direction: column; gap: 8px; }
.comment-form input, .comment-form textarea, .thread-edit textarea {
  background: var(--card); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px; width: 100%;
}
.comment-form input:focus, .comment-form textarea:focus, .thread-edit textarea:focus { outline: 2px solid var(--blue-line); border-color: var(--blue-l); }
.comment-form textarea, .thread-edit textarea { min-height: 72px; resize: vertical; }
.copy-hint { font-size: 13px; color: var(--ink-2); }

.thread-list { margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
.thread { background: var(--blue-bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.thread.resolved { opacity: 0.6; background: var(--section); }
.thread-head { margin-bottom: 4px; }
.thread-reply { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line-2); color: var(--ink-2); }
.thread-quote { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--highlight-border); padding-left: 8px; margin-bottom: 6px; }
.thread.flash { outline: 2px solid var(--blue-l); }
.thread { position: relative; }
.thread.editable { padding-right: 76px; }
.thread.editing { padding-right: 12px; }
.thread-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.thread:hover .thread-actions, .thread:focus-within .thread-actions { opacity: 1; }
@media (hover: none) { .thread-actions { opacity: 1; } }
.thread-edit { display: flex; flex-direction: column; gap: 6px; }
.thread-error { font-size: 13px; color: var(--danger); margin-top: 6px; }
.thread-error:empty { display: none; }
::highlight(plan-comment) { background-color: var(--highlight); }
#select-trigger { position: absolute; z-index: 10; min-height: 36px; padding: 6px 14px; border-radius: 999px; font-size: 13px; box-shadow: 0 4px 14px rgba(21, 24, 35, .18); }
#comment-popup {
  position: absolute; z-index: 11; width: min(420px, calc(100vw - 32px)); background: var(--card);
  border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 12px 32px rgba(21, 24, 35, .16);
}
.popup-quote { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; max-height: 4.5em; overflow: hidden; }
.popup-signature input { margin-top: 6px; }
.stage-anchor-label { margin-top: 6px; }
.popup-interim { font-size: 13px; color: var(--ink-2); min-height: 1.2em; }
.popup-interim.error { color: var(--danger); }

.overview-diagram { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; overflow-x: auto; }
.overview-diagram pre.mermaid { background: none; border: none; padding: 0; margin: 0; }
.overview-diagram .node rect { rx: 10px; ry: 10px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-top: 10px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
.legend .new::before { background: var(--node-new-bg); border-color: var(--node-new-border); }
.legend .changed::before { background: var(--node-changed-bg); border-color: var(--node-changed-border); }
.legend .same::before { background: var(--node-same-bg); border-color: var(--node-same-border); }
main .h2-block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px 16px; margin: 0 0 16px; }
main .h2-block > h2:first-child { margin-top: 16px; }
.point-card h3, .decision-card h3 { margin-top: 16px; }
.point-check { color: var(--ink-2); }
.decision-options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.decision-options button {
  text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 14px; min-height: 48px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer;
}
.decision-options button:hover { background: var(--blue-bg2); }
.decision-options button.recommended { border-color: var(--blue-line); }
.decision-options button.chosen { background: var(--blue-bg); border-color: var(--blue-l); color: var(--blue-d); box-shadow: inset 0 0 0 1px var(--blue-l); }
.decision-recommendation { font-size: 14px; color: var(--ink-2); }
#review-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); z-index: 5;
  display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line); border-bottom: none; border-radius: 16px 16px 0 0;
  padding: 12px 16px; box-shadow: 0 -6px 20px rgba(21, 24, 35, .06);
}
body:has(#review-bar:not([hidden])) { padding-bottom: 96px; }
.review-status { font-size: 14px; color: var(--ink-2); }
#review-bar button.busy { display: inline-flex; align-items: center; gap: 10px; }
#review-bar button.busy::before {
  content: ''; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff;
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1 id="plan-title"></h1>
  <div id="front-matter-strip"></div>
</header>
<nav id="tabs">
  <button type="button" data-tab="requirements">Требования</button>
  <button type="button" data-tab="overview">План</button>
  <button type="button" data-tab="contract">Контракт</button>
  <button type="button" data-tab="implementation">Для агента</button>
</nav>
<main>
  <section id="panel-requirements"></section>
  <section id="panel-overview"></section>
  <section id="panel-contract"></section>
  <section id="panel-implementation"></section>
</main>
<div id="review-bar" hidden>
  <span class="review-status"></span>
  <button type="button">Отправить ревью</button>
</div>

<button id="select-trigger" type="button" hidden>Комментировать</button>
<div id="comment-popup" hidden>
  <div class="popup-quote"></div>
  <div class="comment-form">
    <div class="popup-signature">
      <button type="button" class="link-btn popup-name-toggle">+ Подпись</button>
      <input type="text" placeholder="Имя для подписи" hidden>
    </div>
    <textarea placeholder="Комментарий"></textarea>
    <div class="popup-interim"></div>
    <div class="form-footer">
      <button type="button" class="icon-btn popup-mic" hidden></button>
      <span class="copy-hint" hidden></span>
      <span class="spacer"></span>
      <button type="button" class="btn-text popup-cancel">Отмена</button>
      <button type="button" class="btn-primary btn-sm popup-send">Отправить</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script type="application/json" id="plan-data">__PLAN_DATA__</script>
<script>
const STEP_HEADING_RE = /^S(\d+)\s*·/;
const TAB_KEYS = ['requirements', 'overview', 'contract', 'implementation'];
const TAB_LABELS = { requirements: 'Требования', overview: 'План', contract: 'Контракт', implementation: 'Для агента' };
const DEFAULT_TAB = 'overview';
const WATCH_INTERVAL_MS = 1000;
const AGENT_HINT_DELAY_MS = 60000;
const AGENT_HINT = 'Агент пока не взялся за правки — напиши ему: доработай план по комментариям';
const VIEW_KEY = 'plan-view:';
const ICON_PATHS = {
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
};
const MIC_HINT = 'Диктовать — речь распознаёт macOS на этом компьютере';
const LANES = {
  contained: { label: 'Небольшая правка', hint: 'Правка в одном месте; агент сам перечитал план по критериям ревьюера.' },
  wide: { label: 'Несколько частей', hint: 'Затрагивает несколько частей; план проверил отдельный ревьюер.' },
  closed: { label: 'Рискованная зона', hint: 'Авторизация, данные, подпись или релиз; ревьюер отдельно проверил откат и риски.' },
};
const CHOICE_RE = /^Выбран вариант (\S+)/;
const SILENCE_LEVEL = 0.01;
const STREAM_RATE = 16000;
const STREAM_CHUNK_MS = 100;
const PCM_TAP_WORKLET = `class PcmTap extends AudioWorkletProcessor {
  process(inputs) {
    const channel = inputs[0][0];
    if (channel) this.port.postMessage(channel.slice(0));
    return true;
  }
}
registerProcessor('pcm-tap', PcmTap);`;
const MIC_DENIED = 'Нет доступа к микрофону: разреши его для этой страницы (значок слева от адреса) и для браузера в Системных настройках → Конфиденциальность и безопасность → Микрофон.';
const MIC_SILENT = 'Запись пустая — микрофон не передаёт звук. Проверь, что браузеру разрешён микрофон в Системных настройках → Конфиденциальность и безопасность → Микрофон и что в Системных настройках → Звук → Вход выбран нужный микрофон.';

function loadStoredName() {
  try { return localStorage.getItem('plan-viewer-name') || ''; } catch (e) { return ''; }
}

function storeName(name) {
  try { localStorage.setItem('plan-viewer-name', name); } catch (e) {}
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    return;
  }
  fallbackCopy(text);
}

function parseComments(text) {
  const topRe = /^- \[( |x)\] \[([^\]]+)\] (?:«([^»]*)» )?(?:@([^:]+):\s?)?(.*)$/;
  const replyRe = /^  - (?:@([^:]+):\s?)?(.*)$/;
  const threads = [];
  let current = null;
  text.split(/\r?\n/).forEach(line => {
    const top = topRe.exec(line);
    if (top) {
      current = {
        line, resolved: top[1] === 'x', anchor: top[2], quote: top[3] || '',
        author: (top[4] || '').trim(), text: top[5].trim(), replies: [],
      };
      threads.push(current);
      return;
    }
    const reply = current && replyRe.exec(line);
    if (reply) current.replies.push({ author: (reply[1] || '').trim(), text: reply[2].trim() });
  });
  return threads;
}

function splitH2Blocks(markdown) {
  const blocks = [];
  let current = null;
  let inFence = false;
  markdown.split('\n').forEach(line => {
    if (line.trim().startsWith('```')) {
      inFence = !inFence;
      if (current) current.lines.push(line);
      return;
    }
    if (!inFence) {
      const m = /^## (.+)$/.exec(line);
      if (m) {
        current = { name: m[1].trim(), lines: [line] };
        blocks.push(current);
        return;
      }
    }
    if (current) current.lines.push(line);
  });
  return blocks.map(b => ({ name: b.name, text: b.lines.join('\n') }));
}

function classifyTab(name) {
  if (name === 'Requirements') return 'requirements';
  if (name === 'Contract') return 'contract';
  return 'implementation';
}

function processMermaid(container) {
  container.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  });
}

function renderBlock(text) {
  const el = document.createElement('div');
  el.className = 'h2-block';
  el.innerHTML = marked.parse(text);
  processMermaid(el);
  return el;
}

const QUOTE_LIMIT = 120;
const highlightRanges = [];
const threadRanges = new Map();

function buildThreadItem(thread) {
  const item = document.createElement('div');
  item.className = 'thread' + (thread.resolved ? ' resolved' : '');
  const head = document.createElement('div');
  head.className = 'thread-head';
  const stale = thread.quote && !threadRanges.has(thread);
  head.textContent = [thread.author, thread.resolved ? 'решено' : '', stale ? 'цитата устарела' : '']
    .filter(Boolean).join(' · ');
  if (head.textContent) item.appendChild(head);
  if (thread.quote) {
    const quote = document.createElement('div');
    quote.className = 'thread-quote';
    quote.textContent = thread.quote;
    item.appendChild(quote);
  }
  const body = document.createElement('div');
  body.className = 'thread-body';
  body.textContent = thread.text;
  item.appendChild(body);
  thread.replies.forEach(r => {
    const reply = document.createElement('div');
    reply.className = 'thread-reply';
    reply.textContent = r.author ? `${r.author}: ${r.text}` : r.text;
    item.appendChild(reply);
  });
  thread.element = item;
  if (PLAN_SERVER && !thread.resolved && thread.line) item.appendChild(threadActions(thread, body));
  return item;
}

function threadActions(thread, body) {
  const wrap = document.createElement('div');
  const actions = document.createElement('div');
  actions.className = 'thread-actions';
  const error = document.createElement('div');
  error.className = 'thread-error';
  const editBtn = iconButton('edit', 'Изменить', 'quiet');
  const deleteBtn = iconButton('trash', 'Удалить', 'quiet danger');
  thread.element.classList.add('editable');
  editBtn.addEventListener('click', () => startEdit(thread, body, actions, error));
  deleteBtn.addEventListener('click', () => deleteThread(thread, error));
  if (!CHOICE_RE.test(thread.text)) actions.append(editBtn);
  actions.append(deleteBtn);
  wrap.append(actions, error);
  return wrap;
}

function textButton(text, className) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = className;
  button.textContent = text;
  return button;
}

function iconButton(icon, label, className) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = `icon-btn ${className}`;
  setIcon(button, icon, label);
  return button;
}

function setIcon(button, icon, label) {
  button.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[icon]}</svg>`;
  button.setAttribute('aria-label', label);
  button.title = label;
}

function onSubmitShortcut(textArea, submit) {
  textArea.addEventListener('keydown', event => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) submit();
  });
}

function startEdit(thread, body, actions, error) {
  const editor = document.createElement('div');
  editor.className = 'thread-edit';
  const textArea = document.createElement('textarea');
  textArea.value = thread.text;
  const status = document.createElement('div');
  status.className = 'popup-interim';
  const footer = document.createElement('div');
  footer.className = 'form-footer';
  const micBtn = iconButton('mic', MIC_HINT, 'popup-mic');
  micBtn.hidden = true;
  const spacer = document.createElement('span');
  spacer.className = 'spacer';
  const cancelBtn = textButton('Отмена', 'btn-text');
  const saveBtn = textButton('Сохранить', 'btn-primary btn-sm');
  footer.append(micBtn, spacer, cancelBtn, saveBtn);
  editor.append(textArea, status, footer);
  const dictation = attachDictation(micBtn, textArea, status);
  const finish = () => {
    dictation.cancel();
    editor.replaceWith(body);
    actions.hidden = false;
    thread.element.classList.remove('editing');
  };
  cancelBtn.addEventListener('click', finish);
  const save = async () => {
    await dictation.stop();
    const text = textArea.value.trim().replace(/\s*\n+\s*/g, ' ');
    if (!text) return;
    const result = await postJson('/comments/edit', { line: thread.line, text });
    if (!result || !result.line) {
      error.textContent = 'не удалось сохранить — сервер остановлен?';
      return;
    }
    error.textContent = '';
    thread.text = text;
    thread.line = result.line;
    body.textContent = text;
    finish();
  };
  saveBtn.addEventListener('click', save);
  onSubmitShortcut(textArea, save);
  error.textContent = '';
  actions.hidden = true;
  thread.element.classList.add('editing');
  body.replaceWith(editor);
  textArea.focus();
}

async function deleteThread(thread, error) {
  const result = await postJson('/comments/delete', { line: thread.line });
  if (!result) {
    error.textContent = 'не удалось удалить — сервер остановлен?';
    return;
  }
  thread.element.remove();
  const range = threadRanges.get(thread);
  if (range) {
    highlightRanges.splice(highlightRanges.indexOf(range), 1);
    threadRanges.delete(thread);
    refreshHighlights();
  }
  const choice = CHOICE_RE.exec(thread.text);
  if (choice && thread.region.chosen === choice[1]) markChosen(thread.region, null);
  updateReviewCount(-1);
}

async function postJson(url, payload) {
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!response.ok) return null;
    return await response.json();
  } catch (e) {
    return null;
  }
}

function anchorRegions(block) {
  const regions = [];
  const name = block.dataset.section;
  regions.push({ anchor: name, head: block.querySelector('h2'), nodes: [block] });
  if (name === 'Steps') regions.push(...stepRegions(block));
  if (name === 'Stages') regions.push(...stageRegions(block));
  return regions;
}

function stepRegions(block) {
  const regions = [];
  let current = null;
  Array.from(block.children).forEach(child => {
    const m = child.tagName === 'H3' && STEP_HEADING_RE.exec(child.textContent.trim());
    if (m) {
      current = { anchor: `S${m[1]}`, head: child, nodes: [child] };
      regions.push(current);
      return;
    }
    if (child.tagName === 'H3') current = null;
    if (current) current.nodes.push(child);
  });
  return regions;
}

function stageRegions(block) {
  const table = block.querySelector('table');
  if (!table) return [];
  return Array.from(table.querySelectorAll('tbody tr')).map(row => ({
    anchor: `T${row.cells[0].textContent.trim()}`, head: table, nodes: [row],
  }));
}

function textIndex(nodes) {
  const entries = [];
  let text = '';
  nodes.forEach(root => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (node.parentElement.closest('.thread-list, .mermaid')) continue;
      for (let i = 0; i < node.data.length; i += 1) {
        const ch = /\s/.test(node.data[i]) ? ' ' : node.data[i];
        if (ch === ' ' && text.endsWith(' ')) continue;
        entries.push({ node, offset: i });
        text += ch;
      }
    }
  });
  return { text, entries };
}

function normalizeQuote(quote) {
  return quote.replace(/…$/, '').replace(/\s+/g, ' ').trim();
}

function findQuoteRange(region, quote) {
  const needle = normalizeQuote(quote);
  if (!needle) return null;
  const { text, entries } = textIndex(region.nodes);
  const start = text.indexOf(needle);
  if (start < 0) return null;
  const first = entries[start];
  const last = entries[start + needle.length - 1];
  const range = document.createRange();
  range.setStart(first.node, first.offset);
  range.setEnd(last.node, last.offset + 1);
  return range;
}

function threadListFor(region) {
  if (region.list) return region.list;
  region.list = document.createElement('div');
  region.list.className = 'thread-list';
  if (region.anchor.startsWith('T')) {
    const label = document.createElement('div');
    label.className = 'stage-anchor-label';
    label.textContent = region.anchor;
    region.list.appendChild(label);
  }
  const after = region.head.tagName === 'TABLE' ? lastStageList(region.head) : region.head;
  after.insertAdjacentElement('afterend', region.list);
  return region.list;
}

function lastStageList(table) {
  let el = table;
  while (el.nextElementSibling && el.nextElementSibling.classList.contains('thread-list')) {
    el = el.nextElementSibling;
  }
  return el;
}

function attachThread(region, thread) {
  thread.region = region;
  const range = thread.quote && findQuoteRange(region, thread.quote);
  if (range) {
    threadRanges.set(thread, range);
    if (!thread.resolved) highlightRanges.push(range);
  }
  threadListFor(region).appendChild(buildThreadItem(thread));
  refreshHighlights();
}

function refreshHighlights() {
  if (!window.CSS || !CSS.highlights) return;
  CSS.highlights.set('plan-comment', new Highlight(...highlightRanges));
}

function isInThreadList(node) {
  const el = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
  return Boolean(el && el.closest('.thread-list'));
}

function regionForNode(node, regionsByBlock) {
  const el = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
  const block = el && el.closest('.h2-block');
  if (!block) return null;
  const regions = regionsByBlock.get(block) || [];
  const specific = regions.slice(1).find(r => r.nodes.some(n => n.contains(el)));
  return specific || regions[0];
}

function selectedQuote(range) {
  const text = range.toString().replace(/\s+/g, ' ').replace(/[«»]/g, '"').trim();
  return text.length > QUOTE_LIMIT ? text.slice(0, QUOTE_LIMIT) + '…' : text;
}

function commentLine(anchor, quote, author, text) {
  const quotePart = quote ? `«${quote}» ` : '';
  const authorPart = author ? `@${author}: ` : '';
  return `- [ ] [${anchor}] ${quotePart}${authorPart}${text}`;
}

function setupSelectionComments(regionsByBlock) {
  const trigger = document.getElementById('select-trigger');
  const popup = document.getElementById('comment-popup');
  const nameInput = popup.querySelector('input');
  const nameToggle = popup.querySelector('.popup-name-toggle');
  const textArea = popup.querySelector('textarea');
  const quoteBox = popup.querySelector('.popup-quote');
  const sendBtn = popup.querySelector('.popup-send');
  const hint = popup.querySelector('.copy-hint');
  let pending = null;
  const dictation = attachDictation(popup.querySelector('.popup-mic'), textArea, popup.querySelector('.popup-interim'));
  const showNameToggle = () => {
    const name = nameInput.value.trim();
    nameToggle.textContent = nameInput.hidden ? (name ? `Подпись: ${name}` : '+ Подпись') : 'Свернуть подпись';
  };
  nameToggle.addEventListener('click', () => {
    nameInput.hidden = !nameInput.hidden;
    showNameToggle();
    (nameInput.hidden ? textArea : nameInput).focus();
  });

  sendBtn.textContent = PLAN_SERVER ? 'Отправить' : 'Копировать';

  document.addEventListener('mouseup', event => {
    if (popup.contains(event.target) || trigger.contains(event.target)) return;
    setTimeout(() => showTrigger(), 0);
  });

  function showTrigger() {
    const selection = window.getSelection();
    trigger.hidden = true;
    if (!selection.rangeCount || selection.isCollapsed) return;
    const range = selection.getRangeAt(0);
    const region = regionForNode(range.startContainer, regionsByBlock);
    const quote = selectedQuote(range);
    if (!region || !quote || isInThreadList(range.startContainer)) return;
    pending = { region, quote };
    const rect = range.getBoundingClientRect();
    trigger.style.top = `${rect.bottom + window.scrollY + 6}px`;
    trigger.style.left = `${Math.max(8, rect.left + window.scrollX)}px`;
    trigger.hidden = false;
  }

  trigger.addEventListener('click', () => {
    trigger.hidden = true;
    quoteBox.textContent = `${pending.region.anchor} · «${pending.quote}»`;
    const storedName = loadStoredName();
    nameInput.value = storedName;
    nameInput.hidden = true;
    showNameToggle();
    textArea.value = '';
    hint.hidden = true;
    popup.style.top = trigger.style.top;
    popup.hidden = false;
    const maxLeft = window.scrollX + document.documentElement.clientWidth - popup.offsetWidth - 16;
    popup.style.left = `${Math.max(window.scrollX + 16, Math.min(parseFloat(trigger.style.left), maxLeft))}px`;
    textArea.focus();
  });

  popup.querySelector('.popup-cancel').addEventListener('click', () => {
    dictation.cancel();
    popup.hidden = true;
  });

  const send = async () => {
    await dictation.stop();
    const author = nameInput.value.trim();
    const text = textArea.value.trim().replace(/\s*\n+\s*/g, ' ');
    if (!text || !pending) return;
    if (author) storeName(author);
    const { region, quote } = pending;
    hint.hidden = false;
    if (!PLAN_SERVER) {
      copyText(commentLine(region.anchor, quote, author, text));
      hint.textContent = 'строка скопирована — вставь её в comments.md';
      return;
    }
    const sent = await postJson('/comments', { anchor: region.anchor, quote, author, text });
    if (!sent) {
      hint.textContent = 'не удалось записать — сервер остановлен?';
      return;
    }
    popup.hidden = true;
    attachThread(region, { line: sent.line, resolved: false, anchor: region.anchor, quote, author, text, replies: [] });
    updateReviewCount(1);
    window.getSelection().removeAllRanges();
  };
  sendBtn.addEventListener('click', send);
  onSubmitShortcut(textArea, send);
}

function attachDictation(micBtn, textArea, status) {
  let capture = null;
  const idle = { stop: async () => {}, cancel: () => {} };
  if (!PLAN_SERVER || !navigator.mediaDevices || !window.AudioWorkletNode) return idle;
  micBtn.hidden = false;
  setIcon(micBtn, 'mic', MIC_HINT);
  const showStatus = (text, isError) => {
    status.textContent = text;
    status.classList.toggle('error', isError);
  };
  const finish = async keepText => {
    if (!capture) return;
    const current = capture;
    capture = null;
    micBtn.classList.remove('recording');
    setIcon(micBtn, 'mic', MIC_HINT);
    textArea.readOnly = false;
    if (!keepText) {
      current.abort();
      textArea.value = current.base;
      showStatus('', false);
      return;
    }
    showStatus('Дописываю…', false);
    const result = await current.stop();
    if (result.error) {
      showStatus(result.error, true);
      return;
    }
    textArea.value = joinDictated(current.base, result.text);
    showStatus('', false);
  };
  micBtn.addEventListener('click', async () => {
    if (capture) {
      await finish(true);
      return;
    }
    const base = textArea.value;
    showStatus('Подключаю микрофон…', false);
    try {
      capture = await startCapture(text => { textArea.value = joinDictated(base, text); });
    } catch (e) {
      showStatus(e.message, true);
      return;
    }
    capture.base = base;
    textArea.readOnly = true;
    micBtn.classList.add('recording');
    setIcon(micBtn, 'stop', 'Остановить запись');
    showStatus('Слушаю — текст печатается по ходу речи', false);
  });
  return { stop: () => finish(true), cancel: () => finish(false) };
}

function joinDictated(base, text) {
  return `${base} ${text}`.trim();
}

async function startCapture(onText) {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    throw new Error(MIC_DENIED);
  }
  const context = new AudioContext({ sampleRate: STREAM_RATE });
  const moduleUrl = URL.createObjectURL(new Blob([PCM_TAP_WORKLET], { type: 'application/javascript' }));
  await context.audioWorklet.addModule(moduleUrl);
  URL.revokeObjectURL(moduleUrl);
  const tap = new AudioWorkletNode(context, 'pcm-tap');
  const mute = context.createGain();
  mute.gain.value = 0;
  context.createMediaStreamSource(stream).connect(tap);
  tap.connect(mute).connect(context.destination);
  const recorded = [];
  let pending = [];
  let sending = null;
  tap.port.onmessage = event => {
    recorded.push(event.data);
    pending.push(event.data);
  };
  const started = await postJson('/dictation/start', {});
  const sessionId = started && started.id;
  let streamFailed = !sessionId;
  const flush = async () => {
    if (sending || streamFailed || !pending.length) return;
    const body = toInt16(pending);
    pending = [];
    sending = fetch(`/dictation/${sessionId}/audio`, { method: 'POST', body })
      .then(response => response.json())
      .then(result => (result.error ? (streamFailed = true) : onText(result.text)))
      .catch(() => { streamFailed = true; })
      .finally(() => { sending = null; });
    await sending;
  };
  const timer = setInterval(flush, STREAM_CHUNK_MS);
  const release = () => {
    clearInterval(timer);
    stream.getTracks().forEach(track => track.stop());
    context.close();
  };
  return {
    async stop() {
      clearInterval(timer);
      await sending;
      await flush();
      release();
      const samples = joinSamples(recorded);
      const streamed = streamFailed ? null : await postJson(`/dictation/${sessionId}/stop`, {});
      if (peakLevel(samples) < SILENCE_LEVEL) return { error: MIC_SILENT };
      if (streamed && typeof streamed.text === 'string') return streamed;
      return transcribeSamples(samples);
    },
    abort() {
      release();
      if (sessionId) postJson(`/dictation/${sessionId}/stop`, {});
    },
  };
}

function toInt16(chunks) {
  const samples = joinSamples(chunks);
  const pcm = new Int16Array(samples.length);
  samples.forEach((sample, i) => { pcm[i] = Math.max(-1, Math.min(1, sample)) * 0x7fff; });
  return pcm.buffer;
}

function joinSamples(chunks) {
  const samples = new Float32Array(chunks.reduce((total, chunk) => total + chunk.length, 0));
  let offset = 0;
  chunks.forEach(chunk => {
    samples.set(chunk, offset);
    offset += chunk.length;
  });
  return samples;
}

async function transcribeSamples(samples) {
  try {
    const response = await fetch('/transcribe', { method: 'POST', body: encodeWav(samples, STREAM_RATE) });
    return await response.json();
  } catch (e) {
    return { error: 'Не удалось распознать запись — сервер остановлен?' };
  }
}

function peakLevel(samples) {
  return samples.reduce((peak, sample) => Math.max(peak, Math.abs(sample)), 0);
}

function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeText = (offset, text) => [...text].forEach((ch, i) => view.setUint8(offset + i, ch.charCodeAt(0)));
  writeText(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeText(8, 'WAVEfmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeText(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  samples.forEach((sample, i) => view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, sample)) * 0x7fff, true));
  return buffer;
}

let openComments = 0;
let revising = false;
let awaitingAgent = false;
let submittedAt = 0;

function updateReviewCount(delta) {
  openComments += delta;
  const button = document.querySelector('#review-bar button');
  if (revising) return;
  button.textContent = openComments > 0 ? `Отправить ревью (${openComments})` : 'Имплементировать план';
}

function setRevising(on) {
  const bar = document.getElementById('review-bar');
  const button = bar.querySelector('button');
  const status = bar.querySelector('.review-status');
  revising = on;
  button.disabled = on;
  button.classList.toggle('busy', on);
  status.textContent = on ? 'Правки появляются на странице по мере работы агента' : '';
  if (on) {
    button.textContent = 'Агент правит план…';
    return;
  }
  updateReviewCount(0);
}

function setupReviewBar(planId, version, initialRevising) {
  if (!PLAN_SERVER) return;
  const bar = document.getElementById('review-bar');
  const button = bar.querySelector('button');
  const status = bar.querySelector('.review-status');
  bar.hidden = false;
  setRevising(initialRevising);
  setInterval(() => watchServer(planId, version, status), WATCH_INTERVAL_MS);
  button.addEventListener('click', () => {
    if (openComments > 0) {
      submitReview(planId, button, status);
      return;
    }
    startImplementation(button, status);
  });
}

async function submitReview(planId, button, status) {
  let submitted = null;
  button.disabled = true;
  try {
    const response = await fetch('/submit', { method: 'POST' });
    if (!response.ok) throw new Error(String(response.status));
    submitted = await response.json();
  } catch (e) {
    status.textContent = 'не удалось отправить — сервер остановлен?';
    return;
  } finally {
    button.disabled = false;
  }
  if (!submitted.open) {
    button.hidden = true;
    status.textContent = 'Ревью без комментариев — план принят';
    return;
  }
  awaitingAgent = true;
  submittedAt = Date.now();
  setRevising(true);
}

async function startImplementation(button, status) {
  let response;
  let body = {};
  button.disabled = true;
  try {
    response = await fetch('/implement', { method: 'POST' });
    body = await response.json().catch(() => ({}));
  } catch (e) {
    status.textContent = 'не удалось запустить — сервер остановлен?';
    return;
  } finally {
    button.disabled = false;
  }
  if (response.ok) {
    button.hidden = true;
    status.textContent = 'Имплементация запущена в новом окне Ghostty';
    return;
  }
  if (response.status === 409) {
    status.textContent = `Есть открытые комментарии (${body.open})`;
    openComments = body.open;
    updateReviewCount(0);
    return;
  }
  status.textContent = body.error || 'не удалось запустить имплементацию';
}

async function watchServer(planId, version, status) {
  let alive;
  try {
    const response = await fetch('/alive', { cache: 'no-store' });
    alive = await response.json();
  } catch (e) {
    if (awaitingAgent && Date.now() - submittedAt > AGENT_HINT_DELAY_MS) status.textContent = AGENT_HINT;
    return;
  }
  if (alive.plan !== planId) return;
  if (alive.version !== version) {
    await reloadWhenRenderable(planId);
    return;
  }
  if (awaitingAgent && !alive.revising) return;
  awaitingAgent = false;
  if (alive.revising !== revising) setRevising(alive.revising);
}

async function reloadWhenRenderable(planId) {
  if (isUserTyping()) return;
  try {
    const response = await fetch('/', { cache: 'no-store' });
    if (!response.ok) return;
  } catch (e) {
    return;
  }
  saveView(planId);
  location.reload();
}

function isUserTyping() {
  return !document.getElementById('comment-popup').hidden || document.querySelector('.thread-edit') !== null;
}

function saveView(planId) {
  try {
    sessionStorage.setItem(VIEW_KEY + planId, JSON.stringify({ tab: currentTab, scrollY: window.scrollY }));
  } catch (e) {}
}

function takeSavedView(planId) {
  try {
    const view = JSON.parse(sessionStorage.getItem(VIEW_KEY + planId) || 'null');
    sessionStorage.removeItem(VIEW_KEY + planId);
    return view;
  } catch (e) {
    return null;
  }
}

function setupHighlightClicks() {
  document.addEventListener('click', event => {
    if (window.getSelection().toString()) return;
    const caret = caretRangeAt(event.clientX, event.clientY);
    if (!caret) return;
    for (const [thread, range] of threadRanges) {
      if (!range.isPointInRange(caret.startContainer, caret.startOffset)) continue;
      const details = thread.element.closest('details');
      if (details) details.open = true;
      thread.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
      thread.element.classList.add('flash');
      setTimeout(() => thread.element.classList.remove('flash'), 1200);
      return;
    }
  });
}

function caretRangeAt(x, y) {
  if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
  const pos = document.caretPositionFromPoint && document.caretPositionFromPoint(x, y);
  if (!pos) return null;
  const range = document.createRange();
  range.setStart(pos.offsetNode, pos.offset);
  return range;
}

function renderFrontMatter(fm) {
  const strip = document.getElementById('front-matter-strip');
  if (fm.lane) {
    const badge = document.createElement('span');
    const lane = LANES[fm.lane] || { label: fm.lane, hint: '' };
    badge.className = `lane-badge lane-${fm.lane}`;
    badge.textContent = lane.label;
    badge.title = lane.hint;
    strip.appendChild(badge);
  }
  ['base', 'branch', 'worktree'].forEach(key => {
    if (!fm[key]) return;
    const item = document.createElement('span');
    item.className = 'fm-item';
    item.textContent = `${key}: ${fm[key]}`;
    strip.appendChild(item);
  });
}

function activateTab(key) {
  currentTab = key;
  TAB_KEYS.forEach(k => {
    const panel = document.getElementById(`panel-${k}`);
    const btn = document.querySelector(`button[data-tab="${k}"]`);
    panel.hidden = k !== key;
    if (btn) btn.classList.toggle('active', k === key);
  });
  return renderDiagrams(document.getElementById(`panel-${key}`));
}

let diagramCount = 0;
let PLAN_SERVER = false;
let currentTab = DEFAULT_TAB;

async function renderDiagrams(panel) {
  await document.fonts.ready;
  for (const node of panel.querySelectorAll('.mermaid:not([data-processed])')) {
    diagramCount += 1;
    const { svg } = await mermaid.render(`plan-diagram-${diagramCount}`, node.textContent);
    node.innerHTML = svg;
    node.dataset.processed = 'true';
  }
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function mermaidConfig() {
  return {
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      background: cssVar('--card'),
      primaryColor: cssVar('--section'),
      primaryTextColor: cssVar('--ink'),
      primaryBorderColor: cssVar('--line-2'),
      lineColor: cssVar('--ink-2'),
      textColor: cssVar('--ink'),
      edgeLabelBackground: cssVar('--card'),
      fontFamily: cssVar('--f-body'),
      fontSize: '15px',
    },
    flowchart: { curve: 'basis', nodeSpacing: 40, rankSpacing: 55, padding: 14, htmlLabels: true, useMaxWidth: true },
  };
}

function diagramSource(source) {
  const classDefs = ['new', 'changed', 'same'].map(name =>
    `  classDef ${name} fill:${cssVar(`--node-${name}-bg`)},stroke:${cssVar(`--node-${name}-border`)},` +
    `color:${cssVar(`--node-${name}-fg`)},stroke-width:1.5px`);
  return [source, ...classDefs].join('\n');
}

function renderOverview(brief, stepNodes, panel) {
  const blocks = [];
  if (brief.diagram) panel.appendChild(diagramBlock(brief.diagram));
  if (brief.points.length) panel.appendChild(sectionHeading('Что сделаем'));
  brief.points.forEach(point => {
    const card = pointCard(point, stepNodes);
    panel.appendChild(card.el);
    blocks.push(card);
  });
  if (brief.decisions.length) panel.appendChild(sectionHeading('Решения'));
  brief.decisions.forEach(decision => {
    const card = decisionCard(decision);
    panel.appendChild(card.el);
    blocks.push(card);
  });
  return blocks;
}

function sectionHeading(text) {
  const h2 = document.createElement('h2');
  h2.textContent = text;
  return h2;
}

function diagramBlock(source) {
  const wrap = document.createElement('div');
  const box = document.createElement('div');
  box.className = 'overview-diagram';
  const pre = document.createElement('pre');
  pre.className = 'mermaid';
  pre.textContent = diagramSource(source);
  box.appendChild(pre);
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = '<span class="new">новое</span><span class="changed">меняется</span><span class="same">без изменений</span>';
  wrap.append(sectionHeading('Схема'), box, legend);
  return wrap;
}

function pointCard(point, stepNodes) {
  const el = document.createElement('div');
  el.className = 'h2-block point-card';
  const title = document.createElement('h3');
  title.textContent = `${point.n}. ${point.title}`;
  const text = document.createElement('p');
  text.innerHTML = marked.parseInline(point.text);
  const check = document.createElement('p');
  check.className = 'point-check';
  check.innerHTML = `Проверим: ${marked.parseInline(point.check)}`;
  el.append(title, text, check);
  const stepRegionsInCard = point.steps.map(id => stepNodes.get(`S${id}`)).filter(Boolean);
  if (stepRegionsInCard.length) {
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Технические детали';
    details.appendChild(summary);
    stepRegionsInCard.forEach(region => details.append(...region.nodes));
    el.appendChild(details);
  }
  const anchor = `Пункт ${point.n}`;
  return { el, regions: [{ anchor, head: title, nodes: [el] }, ...stepRegionsInCard] };
}

function decisionCard(decision) {
  const el = document.createElement('div');
  el.className = 'h2-block decision-card';
  const title = document.createElement('h3');
  title.textContent = `Вопрос ${decision.n} · ${decision.question}`;
  const options = document.createElement('div');
  options.className = 'decision-options';
  const recommended = decision.recommendation.split(/\s/)[0];
  const anchor = `Вопрос ${decision.n}`;
  const region = { anchor, head: title, nodes: [el], buttons: new Map() };
  decision.options.forEach(option => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = `${option.key} · ${option.text}`;
    if (option.key === recommended) button.classList.add('recommended');
    button.addEventListener('click', () => chooseOption(region, option.key));
    region.buttons.set(option.key, button);
    options.appendChild(button);
  });
  const recommendation = document.createElement('div');
  recommendation.className = 'decision-recommendation';
  recommendation.textContent = `Рекомендую: ${decision.recommendation}`;
  el.append(title, options, recommendation);
  return { el, regions: [region] };
}

function markChosen(region, key) {
  region.chosen = key;
  region.buttons.forEach((button, optionKey) => button.classList.toggle('chosen', optionKey === key));
}

async function chooseOption(region, key) {
  if (region.chosen === key) return;
  const author = loadStoredName();
  const text = `Выбран вариант ${key}`;
  if (!PLAN_SERVER) {
    copyText(commentLine(region.anchor, '', author, text));
    markChosen(region, key);
    return;
  }
  const sent = await postJson('/comments', { anchor: region.anchor, quote: '', author, text });
  if (!sent) return;
  markChosen(region, key);
  attachThread(region, { line: sent.line, resolved: false, anchor: region.anchor, quote: '', author, text, replies: [] });
  updateReviewCount(1);
}

function setupTabs(counts, view) {
  let firstVisible = null;
  TAB_KEYS.forEach(key => {
    const btn = document.querySelector(`button[data-tab="${key}"]`);
    const panel = document.getElementById(`panel-${key}`);
    const hasContent = panel.children.length > 0;
    btn.hidden = !hasContent;
    panel.hidden = true;
    if (!hasContent) return;
    btn.textContent = counts[key] ? `${TAB_LABELS[key]} (${counts[key]})` : TAB_LABELS[key];
    btn.addEventListener('click', () => activateTab(key));
    if (!firstVisible) firstVisible = key;
  });
  const hasPanel = key => TAB_KEYS.includes(key) && document.getElementById(`panel-${key}`).children.length > 0;
  const preferred = view && hasPanel(view.tab) ? view.tab : DEFAULT_TAB;
  const startTab = hasPanel(preferred) ? preferred : firstVisible;
  if (!startTab) return;
  activateTab(startTab).then(() => {
    if (view) window.scrollTo(0, view.scrollY);
  });
}

function main() {
  const data = JSON.parse(document.getElementById('plan-data').textContent);
  PLAN_SERVER = data.server === true;
  mermaid.initialize(mermaidConfig());

  document.title = data.title || document.title;
  document.getElementById('plan-title').textContent = data.title || '';
  renderFrontMatter(data.frontMatter || {});

  const panels = {
    overview: document.getElementById('panel-overview'),
    requirements: document.getElementById('panel-requirements'),
    contract: document.getElementById('panel-contract'),
    implementation: document.getElementById('panel-implementation'),
  };
  const counts = { overview: 0, requirements: 0, contract: 0, implementation: 0 };
  const regionsByBlock = new Map();
  const regionsByAnchor = new Map();
  const register = (el, regions, tab) => {
    regionsByBlock.set(el, regions);
    regions.forEach(r => regionsByAnchor.set(r.anchor, { region: r, tab }));
  };

  const planBlocks = splitH2Blocks(data.markdown || '').map(block => {
    const tab = classifyTab(block.name);
    const el = renderBlock(block.text);
    el.dataset.section = block.name;
    el.dataset.tab = tab;
    panels[tab].appendChild(el);
    return el;
  });

  if (data.brief) {
    const stepsBlock = planBlocks.find(el => el.dataset.section === 'Steps');
    const stepNodes = new Map((stepsBlock ? stepRegions(stepsBlock) : []).map(r => [r.anchor, r]));
    renderOverview(data.brief, stepNodes, panels.overview).forEach(card => register(card.el, card.regions, 'overview'));
    if (stepsBlock && !stepsBlock.querySelector('h3')) stepsBlock.remove();
  }

  planBlocks.filter(el => el.isConnected).forEach(el => register(el, anchorRegions(el), el.dataset.tab));

  parseComments(data.comments || '').forEach(thread => {
    if (!thread.resolved) openComments += 1;
    const target = regionsByAnchor.get(thread.anchor);
    if (!target) return;
    attachThread(target.region, thread);
    const choice = target.region.buttons && CHOICE_RE.exec(thread.text);
    if (choice) markChosen(target.region, choice[1]);
    if (thread.resolved) return;
    counts[target.tab] += 1;
  });

  setupTabs(counts, PLAN_SERVER ? takeSavedView(data.planId) : null);
  setupSelectionComments(regionsByBlock);
  setupHighlightClicks();
  setupReviewBar(data.planId, data.version, data.revising === true);
}

main();
</script>
