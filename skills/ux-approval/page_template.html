  function renderTerms() {
    const panel = document.getElementById('panel-terms');
    if (!R.terms.length) {
      panel.innerHTML = `<div class="empty">${esc(t('termsEmpty'))}</div>`;
      return;
    }
    const pending = R.terms.filter((term) => !term.approved);
    const rounds = [...new Set(R.terms.filter((term) => term.approved).map((term) => term.approved))].sort((a, b) => a - b);
    const groups = rounds.map((n) => {
      const terms = R.terms.filter((term) => term.approved === n);
      return `<h3 class="term-group">${esc(t('termsApprovedRound', { n, count: terms.length }))}</h3>
        <div class="card term-list">${terms.map(termItem).join('')}</div>`;
    });
    const summary = t('termsSummary', { pending: pending.length, approved: R.terms.length - pending.length });
    panel.innerHTML = `<p class="intro">${esc(summary)}</p>${pending.map(termCard).join('')}${groups.join('')}`;
  }

  const termItem = (term) => (isCollapsedTerm(term) ? termRow(term) : termCard(term));

  function termCard(term) {
    const docId = `term.${term.id}`;
    const opts = termOptions(term).map((o) => ({
      key: o.text,
      html: `<span class="tag">${esc(o.current ? t('termCurrent') : t('termVariant'))}</span><span>${fmt(o.text)}</span>`,
    }));
    const keys = (term.match && term.match.keys) || [];
    const questions = R.questions.filter((q) => (q.terms || []).includes(term.id)).map((q) => q.id);
    const refs = [
      questions.length ? esc(t('termQuestions', { ids: questions.join(', ') })) : '',
      keys.length ? `${esc(t('termKeys', { n: keys.length }))} ${keys.map((k) => `<code>${esc(k)}</code>`).join(' ')}` : '',
    ].filter(Boolean);
    return `<article class="card${term.confidence === 'low' ? ' low' : ''}" data-doc="${esc(docId)}">
      <div class="head"><div class="left"><h3>${fmt(term.source)} · ${termTarget(term)}</h3></div>
        <div class="left">${divergeChip()}${term.approved ? foldButton(term) : (term.confidence ? confidenceChip(term.confidence) : '')}</div></div>
      ${term.approved ? approvedStatus(term) : ''}
      ${term.meaning ? `<p class="small flat">${fmt(term.meaning)}</p>` : ''}
      ${refs.length ? `<ul class="reasons">${refs.map((r) => `<li>${r}</li>`).join('')}</ul>` : ''}
      ${pickBlock(docId, opts, '', term.source)}
      ${othersSlot()}
      ${metaFoot()}
    </article>`;
  }

  function isCollapsedTerm(term) {
    return Boolean(term.approved) && !openedTerms.has(term.id) && !answeredByAnyone(`term.${term.id}`);
  }

  function termRow(term) {
    return `<div class="term-row" data-term="${esc(term.id)}"><span><span class="ok-mark" aria-hidden="true">✓</span> ${fmt(term.source)} · ${termTarget(term)}</span>
      <button class="link-btn" data-act="open-term" data-term="${esc(term.id)}">${esc(t('edit'))}</button></div>`;
  }

  function foldButton(term) {
    if (answeredByAnyone(`term.${term.id}`)) return '';
    return `<button class="link-btn" data-act="close-term" data-term="${esc(term.id)}">${esc(t('termCollapse'))} <span aria-hidden="true">▴</span></button>`;
  }

  function approvedStatus(term) {
    const approved = `<span class="ok-mark">✓ ${esc(t('termApproved', { n: term.approved }))}</span>`;
    const confidence = term.confidence ? ` · ${esc(t('confidenceChip', { level: tMap('confidence', term.confidence) }))}` : '';
    return `<p class="small muted flat">${approved}${confidence}</p>`;
  }

  function termTarget(term) {
    return textPresent(term.target) ? fmt(term.target) : `<span class="muted">${esc(t('termNoTarget'))}</span>`;
  }

  function replaceTermCard(id) {
    const term = termsById.get(id);
    const card = document.querySelector(`#panel-terms .term-row[data-term="${CSS.escape(id)}"], #panel-terms article[data-doc="${CSS.escape(`term.${id}`)}"]`);
    if (!term || !card) return;
    card.outerHTML = termItem(term);
    applyDoc(`term.${id}`);
  }

  const pairReviewRows = (lang) => R.review.filter((r) => r.lang === SRC || r.lang === lang);

  function renderPairs() {
    const counts = { 'review-pairs': reviewPairCount, 'keys-pairs': keysPairCount };
    for (const id of PAIR_SWITCHES) {
      const el = document.getElementById(id);
      el.hidden = TARGETS.length < 2;
      if (el.hidden) continue;
      el.setAttribute('aria-label', t('pairsLabel'));
      el.innerHTML = TARGETS.map((lang) => `<button data-target="${esc(lang)}"${pressed(lang === activeTarget)}>${esc(`${SRC} → ${lang}`)} <span class="n">${esc(counts[id](lang))}</span></button>`).join('');
    }
  }

  function reviewPairCount(lang) {
    const ids = pairReviewRows(lang).map((r) => `review.${r.id}`);
    return `${ids.filter(answeredByAnyone).length}/${ids.length}`;
  }

  function keysPairCount(lang) {
    const done = R.keys.filter((k) => answeredByAnyone(keyDocOf(k, lang)) || answeredByAnyone(`source.${k.key}`)).length;
    return `${done}/${R.keys.length}`;
  }

  function selectTarget(lang) {
    if (lang === activeTarget || !TARGETS.includes(lang)) return;
    flushPendingText();
    activeTarget = lang;
    keyFilter.shown = PAGE_SIZE;
    renderReview();
    document.querySelectorAll('#review-list [data-doc]').forEach((el) => applyDoc(el.dataset.doc));
    renderKeyFilters();
    renderKeys();
    refreshCounts();
  }

  function storedReviewLang() {
    try {
      const stored = localStorage.getItem(REVIEW_LANG_STORE);
      return REVIEW_LANGS.includes(stored) ? stored : 'all';
    } catch (e) {
      return 'all';
    }
  }

  function storeReviewLang() {
    try { localStorage.setItem(REVIEW_LANG_STORE, reviewLang); } catch (e) { /* storage may be blocked */ }
  }

  function renderReviewLangs() {
    const rows = pairReviewRows(activeTarget);
    const el = document.getElementById('review-langs');
    el.hidden = !rows.length;
    if (el.hidden) return;
    const labels = { all: t('filterAll'), target: activeTarget, source: SRC };
    el.setAttribute('aria-label', t('reviewLangLabel'));
    el.innerHTML = REVIEW_LANGS.map((side) =>
      `<button data-review-lang="${side}"${pressed(reviewLang === side)}>${esc(labels[side])} <span class="n">${rows.filter((r) => inReviewLang(r, side)).length}</span></button>`).join('');
  }

  function inReviewLang(r, side) {
    if (side === 'source') return r.lang === SRC;
    if (side === 'target') return r.lang !== SRC;
    return true;
  }

  function renderReview() {
    renderReviewLangs();
    const groups = new Map([[activeTarget, []], [SRC, []]]);
    for (const r of pairReviewRows(activeTarget).filter(matchesReview)) {
      groups.get(r.lang).push(r);
    }
    const html = [...groups.entries()].filter(([, rows]) => rows.length).map(([lang, rows]) =>
      `<div class="part"><h2>${esc(t('reviewGroup', { lang }))} <span class="count">${rows.length}</span></h2>${rows.map(reviewCard).join('')}</div>`);
    const rows = pairReviewRows(activeTarget);
    document.getElementById('review-list').innerHTML = html.length
      ? `<p class="intro">${fmt(t('reviewIntro', { n: rows.length }))}</p>${html.join('')}`
      : `<div class="empty">${esc(t(rows.length ? 'keysEmpty' : 'reviewEmpty'))}</div>`;
  }

  function matchesReview(r) {
    if (!inReviewLang(r, reviewLang)) return false;
    if (!reviewQuery) return true;
    const answers = [...latest(`review.${r.id}`).values()].map((ev) => textOf(ev.text));
    const hay = [r.key, textOf(r.was), textOf(r.proposal), r.why, r.reason ? tMap('reason', r.reason) : '', ...answers].join(' ').toLowerCase();
    return hay.includes(reviewQuery);
  }

  function reviewCard(r) {
    const docId = `review.${r.id}`;
    const hasProposal = textPresent(r.proposal);
    const opts = [
      { key: 'accept', html: `<span>${esc(t('pickAccept'))}</span>${hasProposal ? '' : `<small>${esc(t('noProposal'))}</small>`}`, disabled: !hasProposal },
      { key: 'keep', html: `<span>${esc(t('pickKeep'))}</span>` },
    ];
    return `<article class="card${r.severity === 'blocking' ? ' low' : ''}" data-doc="${esc(docId)}">
      <div class="head"><div class="left"><span class="key">${esc(r.key)}</span><span class="chip">${esc(r.lang)}</span></div>
        <div class="left">${divergeChip()}<span class="chip ${esc(r.severity)}">${esc(tMap('severity', r.severity))}</span></div></div>
      ${r.reason ? `<p class="small muted flat">${fmt(tMap('reason', r.reason))}</p>` : ''}
      <div class="diff small">
        <div class="pair"><b>${esc(t('wasLabel'))}</b><div class="before">${formsView(r.was)}</div></div>
        <div class="pair"><b>${esc(t('proposalLabel'))}</b><div>${hasProposal ? formsView(r.proposal) : '<span class="muted">—</span>'}</div></div>
      </div>
      ${r.why ? `<p class="small muted flat">${fmt(r.why)}</p>` : ''}
      ${pickBlock(docId, opts, r.was, r.key)}
      <p class="small muted flat" data-overridden hidden>${esc(t('reviewOverridden'))}</p>
      ${othersSlot()}
      ${metaFoot()}
    </article>`;
  }

  function keyFlags(e) {
    const flags = new Set((e.projectChange || []).map((p) => p.kind));
    if ((e.invalid || []).length) flags.add('invalid');
    if ((e.changed || []).length) flags.add('changed');
    return flags;
  }

  function wasLine(e, lang) {
    const previous = previousKeysById.get(e.key);
    if (!previous || !(e.changed || []).includes(lang)) return '';
    const value = valueOf(previous, lang);
    const shown = textPresent(value) ? `<div class="struck">${formsView(value)}</div>` : '<span>—</span>';
    return `<div class="was"><span>${esc(t('changedWas', { n: previousRound }))}</span>${shown}</div>`;
  }

  function matchesKey(e) {
    const f = keyFilter;
    if (f.confidence !== 'all' && e.confidence !== f.confidence) return false;
    if (f.batch !== 'all' && e.batch !== f.batch) return false;
    if (f.flag !== 'all' && !hasFlag(e, f.flag)) return false;
    if (f.unreviewed && reviewedByAnyone(keyDocOf(e, activeTarget))) return false;
    if (!f.query) return true;
    const comments = [...latest(`comment.${e.key}`).values()].map((ev) => textOf(ev.text));
    const texts = [valueOf(e, SRC), valueOf(e, activeTarget), slotText(e, SRC, [viewerId]), slotText(e, activeTarget, [viewerId])].map(textOf);
    const hay = [e.key, ...texts, ...comments].join(' ').toLowerCase();
    return hay.includes(f.query);
  }

  function hasFlag(e, flag) {
    if (flag === 'commented') return answeredByAnyone(`comment.${e.key}`);
    if (flag === 'review') return reviewByKey.has(e.key);
    return keyFlags(e).has(flag);
  }

  function keyBadges(e) {
    const flags = keyFlags(e);
    const chip = (flag, text) => `<span class="chip flag-${flag}">${esc(text)}</span>`;
    return [
      overallChip(e),
      flags.has('conflict') ? chip('conflict', t('badgeConflict')) : '',
      flags.has('invalid') ? chip('invalid', t('badgeInvalid')) : '',
      flags.has('project') ? chip('project', t('badgeProject')) : '',
      flags.has('added') ? chip('added', t('badgeAdded')) : '',
      flags.has('changed') ? chip('changed', t('badgeChanged', { langs: e.changed.join(', '), n: previousRound })) : '',
      e.identical ? `<span class="chip">${esc(t('badgeIdentical'))}</span>` : '',
    ].join('');
  }

  function overallChip(e) {
    if (!e.confidence) return '';
    if (!e.langs) return confidenceChip(e.confidence);
    return `<span class="chip ${esc(e.confidence)}" title="${esc(t('confidenceOverall'))}">${esc(tMap('confidenceHint', e.confidence))}</span>`;
  }

  function langChip(e, lang) {
    const item = (e.langs || {})[lang];
    if (!item) return '';
    return `<span class="chip lang-level ${esc(item.confidence)}" title="${esc(tMap('confidenceHint', item.confidence))}">${esc(tMap('confidence', item.confidence))}</span>`;
  }

  function langWhy(e, lang) {
    const item = (e.langs || {})[lang];
    if (!item || !item.reasons.length) return '';
    return `<span class="small muted">${esc(t('langWhy', { reasons: item.reasons.map((code) => reasonText(code, e)).join(', ') }))}</span>`;
  }

  function reasonText(code, e) {
    const [kind, ...rest] = code.split(':');
    const detail = rest.join(':');
    const label = tMap('reasonCode', kind);
    if (kind === 'codeDefect' && (e.compositions || []).length) return t('reasonComposed');
    if (kind === 'review') return `${label} (${tMap('severity', detail)})`;
    if (kind === 'risk') return `${label} (${tMap('risk', detail)})`;
    if (kind === 'term') return `${label} «${(termsById.get(detail) || { source: detail }).source}»`;
    if (kind === 'question') return `${label} ${detail}`;
    return label;
  }

  function keyReasons(e) {
    const rejected = (R.rejected || []).filter((x) => x.key === e.key);
    const terms = (e.terms || []).map((id) => (termsById.get(id) || { source: id }).source);
    return [
      terms.length ? fmt(t('keyTerms', { terms: terms.join(', ') })) : '',
      ...rejected.map((x) => fmt(t('rejectedNote', { lang: x.lang, text: textOf(x.proposal) }))),
      e.identicalWhy ? fmt(e.identicalWhy) : '',
    ].filter(Boolean);
  }

  function conflictOptions(e, lang) {
    const conflicts = objectConflicts(e, lang);
    const vals = (pick) => `<span class="vals">${conflicts.map((c) => `<span><b>${esc(c.lang)}</b>${esc(textOf(pick(c)))}</span>`).join('')}</span>`;
    return [
      { key: 'artifact', html: `<span class="tag">${esc(t('pickArtifact'))}</span>${vals((c) => valueOf(e, c.lang))}` },
      { key: 'project', html: `<span class="tag">${esc(t('pickProject'))}</span>${vals((c) => c.value)}` },
    ];
  }

  function keyCard(e) {
    const batch = batchById.get(e.batch);
    const reasons = keyReasons(e);
    return `<article class="card${e.confidence === 'low' ? ' low' : ''}" data-card="${esc(e.key)}">
      <div class="head"><div class="left"><span class="key">${esc(e.key)}</span><span class="small muted">${esc(batch ? batch.label : e.batch || '')}</span></div>
        <div class="left">${keyBadges(e)}</div></div>
      ${reasons.length ? `<ul class="reasons">${reasons.map((r) => `<li>${r}</li>`).join('')}</ul>` : ''}
      ${decideBlock(e)}
      ${sourceBlock(e)}
      ${targetBlock(e)}
      <div class="others" data-panel-body="others" hidden></div>
      ${commentBlock(e)}
      <label class="check"><input type="checkbox" class="ctl" data-field="reviewed" data-object="${esc(keyDocOf(e, activeTarget))}" id="rev-${esc(e.key)}"${mine(keyDocOf(e, activeTarget)).reviewed === true ? ' checked' : ''}${dis()}> ${esc(t('reviewedLabel'))}</label>
    </article>`;
  }

  function decideBlock(e) {
    const items = decideItems(e);
    if (!items.length) return '';
    const details = items.filter((x) => x.details).map((x) => x.details).join('');
    const toggle = details ? `<button class="toggle-btn" data-act="toggle" data-panel="decide" aria-expanded="false"><span class="when-closed">${esc(t('defectMore'))}</span><span class="when-open">${esc(t('defectLess'))}</span></button>` : '';
    const lines = items.map((x) => `<li><span class="sign" aria-hidden="true">!</span><div>${x.summary}</div></li>`).join('');
    const phrases = (e.compositions || []).map((c) => `<div class="phrase" data-phrase="${esc(c.id)}" data-current="${esc(e.key)}">${phraseInner(c, e.key)}</div>`).join('');
    return `<div class="defect"><div class="defect-head"><b class="summary">${esc(t('decideTitle'))}</b>${toggle}</div><ul class="decide-list">${lines}</ul>${phrases}${details ? `<div class="defect-details" data-panel-body="decide" hidden>${details}</div>` : ''}</div>`;
  }

  function decideItems(e) {
    const langs = [SRC, activeTarget];
    const shown = (x) => langs.includes(x.lang);
    const section = (label, body) => `<div><h4>${label}</h4>${body}</div>`;
    const items = [];
    for (const r of (reviewByKey.get(e.key) || []).filter(shown)) {
      items.push({ summary: `${esc(t('decideReview', { lang: r.lang, severity: tMap('severity', r.severity) }))}${r.why ? ` — <span class="muted">${fmt(r.why)}</span>` : ''}`, details: reviewDetails(e, r) });
    }
    if (e.codeDefect || (e.compositions || []).length) {
      const body = defectDetails(e.defect);
      items.push({ summary: e.codeDefect ? fmt(e.codeDefect) : esc(t('defectComposed')), details: body ? section(esc(t('decideDefect')), `<div class="defect-details">${body}</div>`) : '' });
    }
    if (e.risk) {
      items.push({ summary: esc(t('decideRisk', { risk: tMap('risk', e.risk) })), details: e.riskWhy ? section(esc(t('decideRisk', { risk: tMap('risk', e.risk) })), fmt(e.riskWhy)) : '' });
    }
    for (const x of (e.invalid || []).filter(shown)) items.push({ summary: fmt(t('invalidReason', { lang: x.lang, reason: x.reason })) });
    for (const x of (e.interpreted || []).filter(shown)) items.push({ summary: fmt(t('interpretedNote', { lang: x.lang, who: x.by, text: textOf(x.text) })) });
    for (const id of e.questions || []) {
      const q = questionsById.get(id);
      items.push({ summary: `${esc(t('decideQuestion', { id, title: q ? q.title : '' }))} <button class="link-btn" data-act="goto" data-object="${esc(`q.${id}`)}">${esc(t('goto'))}</button>` });
    }
    for (const change of (e.projectChange || []).filter(shown)) {
      const key = change.kind === 'conflict' ? 'conflictHint' : change.kind === 'added' ? 'badgeAdded' : 'badgeProject';
      items.push({ summary: esc(`${change.lang}: ${t(key)}`) });
    }
    for (const lang of (e.changed || []).filter((x) => langs.includes(x))) items.push({ summary: esc(t('decideChanged', { lang, n: previousRound })) });
    for (const reason of new Set(langs.flatMap((lang) => ((e.langs || {})[lang] || { reasons: [] }).reasons))) {
      if (reason.startsWith('term:')) items.push({ summary: esc(t('decideTerm', { term: (termsById.get(reason.slice(5)) || { source: reason.slice(5) }).source })) });
    }
    return items;
  }

  function reviewDetails(e, r) {
    const object = `review.${r.id}`;
    const now = typeof r.was === 'string' ? r.was.replace(/`/g, '') : r.was;
    const proposal = r.proposal;
    const both = typeof now === 'string' && typeof proposal === 'string' && textPresent(proposal);
    const [nowHtml, proposalHtml] = both ? wordDiff(now, proposal) : [formsView(now), textPresent(proposal) ? formsView(proposal) : `<span class="muted">${esc(t('noProposal'))}</span>`];
    const head = [t('reviewGroup', { lang: r.lang }), tMap('severity', r.severity), r.reason ? tMap('reason', r.reason) : ''].filter(Boolean).join(' · ');
    const a = base(object);
    const fieldDoc = r.lang === SRC ? `source.${e.key}` : keyDocOf(e, r.lang);
    const accept = `<button class="opt ctl" data-proxy-pick="accept"${pressed(a.pick === 'accept')}${textPresent(proposal) ? dis() : ' disabled data-locked="1"'}>${esc(t('pickAccept'))}</button>`;
    const keep = `<button class="opt ctl" data-proxy-pick="keep"${pressed(a.pick === 'keep')}${dis()}>${esc(t('pickKeep'))}</button>`;
    const custom = `<button class="opt ctl" data-act="focus-field" data-object="${esc(fieldDoc)}"${dis()}>${esc(t('pickCustom'))}</button>`;
    return `<div class="decide-review"><h4>${esc(head)}</h4>
      <div class="line"><span>${esc(t('reviewNow'))}</span><div>${nowHtml}</div></div>
      <div class="line"><span>${esc(t('reviewProposes'))}</span><div>${proposalHtml}</div></div>
      ${r.why ? `<div class="line"><span>${esc(t('reviewWhy'))}</span><div class="muted">${fmt(r.why)}</div></div>` : ''}
      <div class="opts" data-review-proxy="${esc(object)}">${accept}${keep}${custom}</div>
      <p class="small muted flat">${esc(t('decideSameAnswer'))}</p></div>`;
  }

  function wordDiff(before, after) {
    const a = before.split(/(\s+)/);
    const b = after.split(/(\s+)/);
    const lcs = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
    for (let i = a.length - 1; i >= 0; i -= 1) {
      for (let j = b.length - 1; j >= 0; j -= 1) lcs[i][j] = a[i] === b[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
    let i = 0;
    let j = 0;
    let left = '';
    let right = '';
    while (i < a.length || j < b.length) {
      if (i < a.length && j < b.length && a[i] === b[j]) { left += esc(a[i]); right += esc(b[j]); i += 1; j += 1; }
      else if (j < b.length && (i >= a.length || lcs[i][j + 1] >= lcs[i + 1][j])) { right += /^\s+$/.test(b[j]) ? esc(b[j]) : `<ins>${esc(b[j])}</ins>`; j += 1; }
      else { left += /^\s+$/.test(a[i]) ? esc(a[i]) : `<del>${esc(a[i])}</del>`; i += 1; }
    }
    return [left, right];
  }

  function applyReviewProxies(object) {
    const a = base(object);
    document.querySelectorAll(`[data-review-proxy="${CSS.escape(object)}"]`).forEach((box) => {
      box.querySelectorAll('[data-proxy-pick]').forEach((b) => b.setAttribute('aria-pressed', String(a.pick === b.dataset.proxyPick)));
    });
  }

  function defectDetails(d) {
    if (!d) return '';
    const section = (label, body) => `<div><h4>${label}</h4>${body}</div>`;
    const uses = (d.uses || []).map((u) => `<div class="use"><div>${fmt(u.where)}</div>${u.question ? `<div class="q">${fmt(t('useQuestion', { text: u.question }))}</div>` : ''}${u.action ? `<div class="q">${fmt(t('useAction', { text: u.action }))}</div>` : ''}${u.needed ? `<div>${esc(t('useNeeded'))} <b>${esc(u.needed)}</b></div>` : ''}</div>`).join('');
    return [
      uses ? section(esc(t('defectUses')), `<div class="uses">${uses}</div>`) : '',
      d.why ? section(esc(t('defectWhy')), fmt(d.why)) : '',
      d.now ? section(esc(t('defectNow')), fmt(d.now)) : '',
      d.devTask ? section(`${esc(t('defectDevTask'))}<span class="task">${esc(t('defectTaskTag'))}</span>`, fmt(d.devTask)) : '',
    ].join('');
  }

  function phraseInner(c, current) {
    const shape = c.pattern.replace(PATTERN_TOKEN_RE, (m, name) => `{${name}}`);
    const lines = [SRC, activeTarget].map((lang) => `<div class="line"><b>${esc(lang)}</b>${assembledPhrase(c, lang, current)}</div>`).join('');
    const site = c.site ? `<span class="small muted">${esc(t('phraseSite', { site: c.site }))}</span>` : '';
    return `<span class="small muted">${fmt(t('phraseTitle', { pattern: `\`${shape}\`` }))}</span>${lines}${site}`;
  }

  function assembledPhrase(c, lang, current) {
    let html = '';
    let at = 0;
    for (const m of c.pattern.matchAll(PATTERN_TOKEN_RE)) {
      html += esc(c.pattern.slice(at, m.index)) + phrasePart(c, lang, m[1], m[2], current);
      at = m.index + m[0].length;
    }
    return html + esc(c.pattern.slice(at));
  }

  function phrasePart(c, lang, name, count, current) {
    if (!c.keys.includes(name)) return esc(String(c.sample[name] ?? ''));
    const e = keysById.get(name);
    const value = e ? slotText(e, lang, [viewerId]) : null;
    const form = value && typeof value === 'object' ? value[pluralForm(lang, c.sample[count])] ?? value.other : value;
    const text = String(form ?? '—').replace(/\{(\w*)\}/g, (m, k) => (k in c.sample ? String(c.sample[k]) : m));
    return name === current ? `<mark>${esc(text)}</mark>` : esc(text);
  }

  function pluralForm(lang, n) {
    try { return new Intl.PluralRules(lang).select(Number(n)); } catch (err) { return 'other'; }
  }

  function applyPhrases(key) {
    const ids = new Set(((keysById.get(key) || {}).compositions || []).map((c) => c.id));
    document.querySelectorAll('[data-phrase]').forEach((el) => {
      if (!ids.has(el.dataset.phrase)) return;
      const c = ((keysById.get(el.dataset.current) || {}).compositions || []).find((x) => x.id === el.dataset.phrase);
      if (c) el.innerHTML = phraseInner(c, el.dataset.current);
    });
  }

  function textRow(docId, e, lang, editable) {
    const shape = valueOf(e, lang);
    const body = editable ? editorHtml(docId, shape, slotText(e, lang, [viewerId]), e.key, restorableField) : `<div class="field">${formsView(shape)}</div>`;
    const note = editable && typeof shape !== 'object' ? '<span class="edited-note" data-edited="" hidden></span>' : '';
    const base = lang === SRC;
    const conflict = conflictsOf(e).some((c) => c.lang === lang);
    return `<div class="pair with-role${base ? ' base' : ''}${editable ? '' : ' readonly'}${conflict ? ' conflict' : ''}"><b>${esc(lang)}<span class="role">${esc(t(base ? 'roleSource' : 'roleTarget'))}</span>${langChip(e, lang)}</b>${body}${wasLine(e, lang)}
      <div class="field-note">${note}<span class="issues" data-issues hidden></span><span class="small muted" data-meta></span>${langWhy(e, lang)}</div></div>`;
  }

  function sourceBlock(e) {
    const docId = `source.${e.key}`;
    return `<div class="key-block" data-doc="${esc(docId)}">${textRow(docId, e, SRC, !objectConflicts(e, TARGETS[0]).length)}</div>`;
  }

  function targetBlock(e) {
    const lang = activeTarget;
    const docId = keyDocOf(e, lang);
    const conflict = objectConflicts(e, lang).length > 0;
    const choice = conflict ? `<p class="small muted flat">${esc(t('conflictHint'))}</p>${pickBlock(docId, conflictOptions(e, lang), valueOf(e, editLangOf(e, lang)), e.key)}` : '';
    return `<div class="key-block" data-doc="${esc(docId)}">
      ${textRow(docId, e, lang, !conflict)}
      ${choice}
      <div class="foot">
        <span class="foot-actions">
          <button class="toggle-btn" data-act="toggle" data-panel="comment" aria-expanded="false">${esc(t('commentToggle'))}<span class="n" data-count hidden></span></button>
          <button class="toggle-btn" data-act="toggle" data-panel="others" aria-expanded="false" hidden>${esc(t('othersTitle'))}<span class="n" data-count hidden></span><span class="dot" data-diverge hidden></span></button>
        </span>
      </div>
    </div>`;
  }

  function commentBlock(e) {
    const docId = `comment.${e.key}`;
    const label = t('commentToggle');
    return `<div class="key-block" data-doc="${esc(docId)}" data-panel-body="comment" hidden>
      <textarea class="ctl" data-form="" id="${esc(`cm-${e.key}`)}" rows="2" placeholder="${esc(t('notePlaceholder'))}" aria-label="${esc(`${label} ${e.key}`)}"${dis()}></textarea>
      ${othersSlot()}
      ${metaFoot()}
    </div>`;
  }

  function renderKeyFilters() {
    const counts = { all: R.keys.length };
    for (const k of R.keys) counts[k.confidence] = (counts[k.confidence] || 0) + 1;
    document.getElementById('keys-confidence').innerHTML = ['all', ...CONFIDENCE_ORDER].map((c) =>
      `<button data-confidence="${c}"${pressed(keyFilter.confidence === c)}>${esc(c === 'all' ? t('filterAll') : tMap('confidence', c))} <span class="n">${counts[c] || 0}</span></button>`).join('');
    if (keyFilter.batch !== 'all' && !batchById.has(keyFilter.batch)) keyFilter.batch = 'all';
    const batch = document.getElementById('keys-batch');
    batch.innerHTML = `<option value="all">${esc(t('filterBatchAll'))}</option>${R.batches.map((b) => `<option value="${esc(b.id)}">${esc(b.label)} (${b.count ?? ''})</option>`).join('')}`;
    batch.value = keyFilter.batch;
    const flagCounts = {};
    for (const k of R.keys) for (const f of keyFlags(k)) flagCounts[f] = (flagCounts[f] || 0) + 1;
    flagCounts.commented = R.keys.filter((k) => answeredByAnyone(`comment.${k.key}`)).length;
    flagCounts.review = R.keys.filter((k) => reviewByKey.has(k.key)).length;
    const flagLabels = { conflict: 'badgeConflict', invalid: 'badgeInvalid', project: 'badgeProject', added: 'badgeAdded', changed: 'filterChanged', commented: 'filterCommented', review: 'filterReviewRows' };
    const flag = document.getElementById('keys-flag');
    flag.innerHTML = `<option value="all">${esc(t('filterFlagAll'))}</option>${FLAGS.filter((f) => flagCounts[f]).map((f) => `<option value="${f}">${esc(t(flagLabels[f]))} (${flagCounts[f]})</option>`).join('')}`;
    if (keyFilter.flag !== 'all' && !flagCounts[keyFilter.flag]) keyFilter.flag = 'all';
    flag.value = keyFilter.flag;
  }

  function renderKeys() {
    const list = keyOrder.filter(matchesKey);
    const visible = list.slice(0, keyFilter.shown);
    document.getElementById('keys-list').innerHTML = visible.length
      ? visible.map(keyCard).join('')
      : `<div class="empty">${esc(t('keysEmpty'))}</div>`;
    document.getElementById('keys-count').textContent = t('keysCount', { shown: visible.length, matched: list.length, total: R.keys.length });
    const more = document.getElementById('keys-more');
    more.hidden = list.length <= visible.length;
    more.textContent = t('showMore', { n: Math.min(PAGE_SIZE, list.length - visible.length) });
    document.querySelectorAll('#keys-list [data-doc]').forEach((el) => applyDoc(el.dataset.doc));
  }

  function editorLine(object, id, ev, lang) {
    const me = id === viewerId ? ` ${t('you')}` : '';
    const reviewed = isKey(object) && ev.reviewed === true ? ` · <span class="ok">${esc(t('reviewedLabel'))}</span>` : '';
    const tag = lang ? ` · ${esc(lang.toUpperCase())}` : '';
    return `<span class="who">${esc(who(id) + me)}</span>${tag} · ${fmt(valueLabel(object, ev))}${reviewed} · <span class="when">${esc(when(ev.at))}</span>`;
  }

  function sortedEvents(object) {
    return [...(eventsByObject.get(object) || [])].sort((a, b) => String(b.at).localeCompare(String(a.at)));
  }

  function summaryTouched(object) {
    for (const ev of latest(object).values()) {
      if (isKey(object) ? Boolean(ev.pick) || textPresent(ev.text) : hasAnswer(object, ev)) return true;
    }
    return false;
  }

  function sectionRows() {
    return [
      ['tabQuestions', R.questions.map((q) => [`q.${q.id}`, fmt(q.title), false])],
      ['notesSection', noteObjects().map((object) => [object, esc(t('notesSection')), false])],
      ['tabTerms', R.terms.map((x) => [`term.${x.id}`, fmt(`${x.source} · ${x.target || '—'}`), false])],
      ['tabReview', R.review.map((r) => [`review.${r.id}`, esc(`${r.lang} · ${r.key}`), true])],
      ['tabKeys', TARGETS.flatMap((lang) => R.keys.map((k) => [keyDocOf(k, lang), esc(TARGETS.length > 1 ? `${lang} · ${k.key}` : k.key), true]))],
      ['sectionSource', R.keys.map((k) => [`source.${k.key}`, esc(k.key), true])],
      ['sectionKeyComments', R.keys.map((k) => [`comment.${k.key}`, esc(k.key), true])],
    ];
  }

  function exportBlock() {
    const n = selectedRound;
    const button = (act, label, lang = '') => `<button class="more" data-act="${act}" data-lang="${esc(lang)}">${esc(label)}</button>`;
    return `<div class="export">
        <h3>${esc(t('exportTitle', { n }))}</h3>
        <div class="export-row">
          ${button('export-brief', t('exportBrief'))}
          ${button('export-source', t('exportLangFile', { lang: SRC }))}
          ${TARGETS.map((lang) => button('export-target', t('exportLangFile', { lang }), lang)).join('')}
          ${button('export-answers', t('exportAnswersJson'))}
          ${button('export-xlsx', t('exportAnswersXlsx'))}
          ${R.terms.length ? button('export-terms', t('exportTerms')) : ''}
        </div>
        <span class="small muted" id="export-note"></span>
      </div>`;
  }

  function renderSummary() {
    const body = sectionRows().map(([title, rows]) => {
      const items = rows.filter(([object]) => summaryTouched(object))
        .map(([object, label, mono]) => ({ object, label, mono, diverged: isDiverged(object) }))
        .sort((a, b) => Number(b.diverged) - Number(a.diverged));
      if (!items.length) return '';
      return `<h2>${esc(t(title))} <span class="count">${items.length}</span></h2><ul class="sum-list">${items.map(sumItem).join('')}</ul>`;
    }).join('');
    const reviewed = R.keys.filter((k) => TARGETS.some((lang) => reviewedByAnyone(keyDocOf(k, lang)))).length;
    document.getElementById('panel-summary').innerHTML =
      `<p class="intro">${fmt(t('summaryIntro', { reviewed, total: R.keys.length }))}</p>
      ${exportBlock()}
      ${body || `<div class="empty">${esc(t('summaryEmpty'))}</div>`}`;
  }

  function sumItem(item) {
    const lines = [...latest(item.object).entries()]
      .filter(([, ev]) => hasAnswer(item.object, ev))
      .sort((a, b) => String(b[1].at).localeCompare(String(a[1].at)))
      .map(([id, ev]) => `<li>${editorLine(item.object, id, ev)}${id === viewerId && writable ? ownActions(item.object) : ''}</li>`).join('');
    const key = keyEntryOf(item.object);
    const lang = key && isKey(item.object) ? editLangOf(key, rowLangOf(item.object)) : rowLangOf(item.object);
    const original = key ? `<span class="small muted">${esc(`${lang}: ${textOf(valueOf(key, lang))}`)}</span>` : '';
    const chip = item.diverged ? `<span class="chip diverge">${esc(t('badgeDiverge'))}</span>` : '';
    return `<li class="${item.diverged ? 'diverged' : ''}"><div class="sum-head"><span class="${item.mono ? 'key' : ''}">${item.label}</span><span class="own-actions">${chip}<button class="link-btn" data-act="goto" data-object="${esc(item.object)}">${esc(t('goto'))}</button></span></div>
      ${original}<ul class="sum-answers">${lines}</ul></li>`;
  }

  function ownActions(object) {
    const o = esc(object);
    return `<span class="own-actions"><button class="link-btn" data-act="edit" data-object="${o}">${esc(t('edit'))}</button><button class="link-btn danger" data-act="clear" data-object="${o}">${esc(t('clearMine'))}</button></span>`;
  }

  function refreshCounts() {
    const done = (ids) => ids.filter(answeredByAnyone).length;
    document.getElementById('n-questions').textContent = `${done(R.questions.map((q) => `q.${q.id}`))}/${R.questions.length}`;
    const pendingTerms = R.terms.filter((x) => !x.approved).map((x) => `term.${x.id}`);
    document.getElementById('n-terms').textContent = pendingTerms.length ? `${done(pendingTerms)}/${pendingTerms.length}` : '✓';
    document.getElementById('n-review').textContent = reviewPairCount(activeTarget);
    document.getElementById('n-keys').textContent = keysPairCount(activeTarget);
    renderPairs();
    let answered = 0;
    for (const object of latestByObject.keys()) if (summaryTouched(object)) answered += 1;
    document.getElementById('n-summary').textContent = String(answered);
    if (activeTab === 'summary') renderSummary();
  }

  function applyEditors(el, docId) {
    const pending = (inflight.get(docId) || 0) > 0;
    el.toggleAttribute('data-pending', pending);
    const meta = el.querySelector('[data-meta]');
    if (meta) {
      const own = mine(docId);
      const at = hasAnswer(docId, own) ? own.at : null;
      meta.textContent = pending ? t('saving') : (at ? t('yourAnswerAt', { when: when(at) }) : '');
    }
    const e = keyEntryOf(docId);
    if (e) { applyKeyOthers(e); return; }
    const chip = el.querySelector('[data-diverge]');
    if (chip) chip.hidden = !isDiverged(docId);
    const box = el.querySelector('[data-others]');
    if (!box) return;
    fillOthers(box, [[docId, '']]);
    box.hidden = !otherAnswers([[docId, '']]).length;
  }

  function applyKeyOthers(e) {
    const block = cardEl(keyDocOf(e, activeTarget));
    if (!block) return;
    const card = block.closest('.card');
    const objects = [[`source.${e.key}`, SRC], [keyDocOf(e, activeTarget), editLangOf(e, activeTarget)]];
    const panel = card.querySelector('[data-panel-body="others"]');
    fillOthers(panel, objects, true);
    const button = card.querySelector('[data-panel="others"]');
    const count = new Set(otherAnswers(objects).map(([, , id]) => id)).size;
    button.hidden = !count;
    setCount(button, count);
    const diverged = objects.some(([object]) => differsFromMine(object));
    button.querySelector('[data-diverge]').hidden = !diverged;
    button.title = diverged ? t('divergeHint') : '';
    if (!count) { closePanel(card, 'others'); return; }
    if (panel.dataset.opened || !diverged) return;
    openPanel(card, 'others', true);
  }

  function fillOthers(box, objects, markDiffers) {
    const events = objects.flatMap(([object, lang]) => historyEvents(object).filter((ev) => !isWithdrawnBy(object, ev.by)).map((ev) => [object, lang, ev.by, ev]))
      .sort((a, b) => String(b[3].at).localeCompare(String(a[3].at)));
    if (!events.length) { box.innerHTML = ''; return 0; }
    const others = otherAnswers(objects);
    const line = ([object, lang, id, ev]) => `<li>${editorLine(object, id, ev, lang)}</li>`;
    const otherLine = (entry) => (markDiffers && differsFromMineAt(entry[0], entry[3])
      ? `<li class="differs">${editorLine(entry[0], entry[2], entry[3], entry[1])} · <span class="diverge-line">${esc(t('divergeLine'))}</span></li>`
      : line(entry));
    const wasOpen = Boolean(box.querySelector('details[open]'));
    const lines = others.length ? `<ul>${others.map(otherLine).join('')}</ul>` : `<span class="muted">${esc(t('othersNone'))}</span>`;
    const title = objects.every(([object]) => object.startsWith('comment.')) ? 'commentsTitle' : 'othersTitle';
    box.innerHTML = `<h4>${esc(t(title))}</h4>${lines}
      <details${wasOpen ? ' open' : ''}><summary>${esc(t('historyTitle', { n: events.length }))}</summary><ul>${events.map(line).join('')}</ul></details>`;
    return events.length;
  }

  function historyEvents(object) {
    return sortedEvents(object).filter((ev, i, list) => i === 0 || list[i - 1].by !== ev.by);
  }

  function isWithdrawnBy(object, by) {
    const last = latest(object).get(by);
    return Boolean(last) && !hasAnswer(object, last);
  }

  function otherAnswers(objects) {
    return objects.flatMap(([object, lang]) => [...latest(object).entries()]
      .filter(([id, ev]) => id !== viewerId && hasAnswer(object, ev))
      .map(([id, ev]) => [object, lang, id, ev]));
  }

  function setCount(button, count) {
    const n = button.querySelector('[data-count]');
    n.hidden = !count;
    n.textContent = String(count);
  }

  function closePanel(card, name) {
    card.querySelector(`[data-panel-body="${name}"]`).hidden = true;
    card.querySelector(`[data-panel="${name}"]`).setAttribute('aria-expanded', 'false');
  }

  function differsFromMine(object) {
    return [...latest(object).entries()].some(([id, ev]) => id !== viewerId && differsFromMineAt(object, ev));
  }

  function differsFromMineAt(object, ev) {
    const own = answerSignature(object, mine(object));
    return own !== null && ![null, own].includes(answerSignature(object, ev));
  }

  function openPanel(card, name, open) {
    const panel = card.querySelector(`[data-panel-body="${name}"]`);
    panel.hidden = !open;
    panel.dataset.opened = '1';
    card.querySelector(`[data-panel="${name}"]`).setAttribute('aria-expanded', String(open));
  }

  function applyPressed(el, docId) {
    const a = base(docId);
    const typing = textTimers.has(docId);
    el.querySelectorAll('[data-pick]').forEach((b) => b.setAttribute('aria-pressed', String(!typing && a.pick === b.dataset.pick)));
    const custom = el.querySelector('[data-act="custom"]');
    if (custom) custom.setAttribute('aria-pressed', String(typing || a.pick === 'custom'));
    const unpick = el.querySelector('[data-act="unpick"]');
    if (unpick) unpick.hidden = typing || !a.pick;
  }

  function editorFill(docId, a) {
    const plain = plainKeyEntry(docId);
    if (plain) return slotText(plain, rowLangOf(docId), [viewerId]);
    return a.pick === 'custom' ? a.text : null;
  }

  function applyDoc(docId) {
    if (docId.startsWith('review.')) applyReviewProxies(docId);
    const el = cardEl(docId);
    if (!el) return;
    const a = base(docId);
    const typing = textTimers.has(docId);
    const sent = (inflight.get(docId) || 0) > 0;
    applyPressed(el, docId);
    if (!typing) {
      const value = editorFill(docId, a);
      el.querySelectorAll('textarea[data-form]').forEach((area) => {
        if (area === document.activeElement) return;
        const form = area.dataset.form;
        area.value = form ? (value && typeof value === 'object' ? value[form] ?? '' : '') : (typeof value === 'string' ? value : '');
      });
    }
    const plain = plainKeyEntry(docId);
    if (plain) applyEdited(el, docId, plain, a);
    if (plain) applyIssues(el, docId);
    const rev = isKey(docId) ? el.closest('.card').querySelector('[data-field="reviewed"]') : null;
    if (rev && !sent) rev.checked = a.reviewed === true;
    if (docId.startsWith('review.')) applyOverridden(el, docId);
    if (docId.startsWith('comment.')) applyComments(el, docId);
    applyEditors(el, docId);
  }

  function applyIssues(el, docId) {
    const e = plainKeyEntry(docId);
    const box = el.querySelector('[data-issues]');
    if (!e || !box) return;
    const lang = rowLangOf(docId);
    const issues = textIssues(lang, typedValue(el), valueOf(e, lang));
    box.hidden = !issues.length;
    box.textContent = issues.length ? t('issuesNote', { issues: issues.map(issueText).join('; ') }) : '';
  }

  function typedValue(el) {
    const areas = [...el.querySelectorAll('textarea[data-form]')];
    if (!areas.length || !areas[0].dataset.form) return areas.length ? areas[0].value : '';
    return Object.fromEntries(areas.map((area) => [area.dataset.form, area.value]));
  }

  function textIssues(lang, text, roundValue) {
    if (!textPresent(text) || matchesSlot(text, roundValue)) return [];
    const script = ((DATA.textRules || {}).foreignScript || {})[lang];
    const found = script && new RegExp(script).test(textOf(text)) ? ['foreignScript'] : [];
    if (typeof text !== 'object') return found.concat(placeholderIssues(text, typeof roundValue === 'string' ? roundValue : null));
    const reference = roundValue && typeof roundValue === 'object' ? roundValue : {};
    for (const [form, value] of Object.entries(text)) {
      if (!String(value ?? '').trim()) found.push(`emptyForm:${form}`);
      else found.push(...placeholderIssues(value, reference[form] ?? reference.other ?? null));
    }
    return found;
  }

  function placeholderIssues(text, roundText) {
    if (roundText == null) return [];
    const marks = (s) => (String(s).match(/\{[^{}]*\}/g) || []).sort().join(' ');
    return marks(text) === marks(roundText) ? [] : [`placeholders:${(String(roundText).match(/\{[^{}]*\}/g) || []).join(' ')}`];
  }

  function issueText(code) {
    const [kind, ...rest] = code.split(':');
    return t(`issue_${kind}`, { detail: rest.join(':') });
  }

  function applyEdited(el, docId, e, a) {
    const own = a.pick === 'custom' && textPresent(a.text) ? a.text : null;
    const shown = slotText(e, rowLangOf(docId), [viewerId], docId);
    el.querySelectorAll('[data-slot]').forEach((field) => applyEditedSlot(el, field, own, shown));
  }

  function applyEditedSlot(el, field, own, shown) {
    const form = field.dataset.slot;
    const was = slotPart(shown, form);
    const edited = own !== null && (!form || slotPart(own, form) !== was);
    field.classList.toggle('edited', edited);
    const note = el.querySelector(`[data-edited="${CSS.escape(form)}"]`);
    note.hidden = !edited;
    note.innerHTML = `${esc(t('editedMark'))} · ${textPresent(was) ? `<s>${esc(clip(was, 80))}</s>` : '—'}`;
    const restore = field.querySelector('[data-act="restore"]');
    const label = t('restoreTo', { text: clip(was, 40) });
    restore.hidden = !edited;
    restore.title = label;
    restore.setAttribute('aria-label', label);
  }

  function slotPart(value, form) {
    if (!form) return textOf(value);
    return value && typeof value === 'object' ? String(value[form] ?? '') : '';
  }

  function applyOverridden(el, docId) {
    const row = reviewById.get(docId.slice(7));
    const e = row && keysById.get(row.key);
    if (!e) return;
    el.querySelector('[data-overridden]').hidden = !isOverridden(docId, e, row.lang);
  }

  function isOverridden(docId, e, lang) {
    if (!hasAnswer(docId, base(docId))) return false;
    const winner = slotWinner(e, lang, [viewerId]);
    return Boolean(winner) && winner[0] !== docId;
  }

  function applyComments(el, docId) {
    const count = [...latest(docId).values()].filter((ev) => hasAnswer(docId, ev)).length;
    const card = el.closest('.card');
    setCount(card.querySelector('[data-panel="comment"]'), count);
    if (!count || el.dataset.opened) return;
    openPanel(card, 'comment', true);
  }

  function statusText() {
    if (mode === 'write' && !roundOpen(selectedRound)) return t('statusRoundLocked');
    const keys = { loading: 'statusLoading', nodb: 'statusNoDb', read: 'statusRead', write: 'statusWrite', refused: 'statusRefused', lost: 'statusLost' };
    return t(keys[mode] || 'statusRead');
  }

  function updateWritable() {
    writable = mode === 'write' && roundOpen(selectedRound);
    const status = document.getElementById('status');
    status.dataset.mode = mode;
    status.textContent = statusText();
    document.querySelectorAll('.ctl').forEach((c) => { c.disabled = !writable || c.dataset.locked === '1'; });
    renderRoundSwitcher();
    renderRoundBar();
    applyEmailForm();
    renderNotes();
  }

  function setMode(next) {
    mode = next;
    updateWritable();
  }

  function sameAnswer(a, b) {
    return (a.pick ?? null) === (b.pick ?? null)
      && JSON.stringify(a.text ?? null) === JSON.stringify(b.text ?? null)
      && (a.reviewed === true) === (b.reviewed === true);
  }

  function ensureEditor() {
    if (editors.has(viewerId)) return Promise.resolve();
    if (editorReady) return editorReady;
    editorReady = (async () => {
      const ref = dbNs.doc(`editors/${viewerId}`);
      const snap = await ref.get();
      if (snap.exists) return;
      const me = await userNs.me();
      await ref.set({ email: me.email || null, name: me.name || '', firstSeenAt: new Date().toISOString() });
    })().catch(() => { editorReady = null; });
    return editorReady;
  }

  function save(docId, patch) {
    if (!writable || !logRef || !viewerId) return;
    const prev = base(docId);
    const next = { pick: prev.pick ?? null, text: prev.text ?? null, reviewed: prev.reviewed === true, ...patch };
    if (sameAnswer(next, prev)) return;
    const body = { object: docId, by: viewerId, at: new Date().toISOString(), round: selectedRound, ...next };
    lastSent.set(docId, body);
    inflight.set(docId, (inflight.get(docId) || 0) + 1);
    applyDoc(docId);
    ensureEditor().then(() => addOnce(body, true)).then((ref) => {
      if (!ref) { settle(docId, true); return; }
      if (allEvents.has(ref.id)) { settle(docId, false); return; }
      awaiting.set(ref.id, docId);
    });
  }

  function settle(docId, failed) {
    inflight.set(docId, Math.max(0, (inflight.get(docId) || 0) - 1));
    if (failed && !inflight.get(docId)) lastSent.delete(docId);
    applyDoc(docId);
  }

  function addOnce(body, mayRetry) {
    return logRef.add(body).catch((e) => {
      const code = e && e.code;
      if (code === 'unavailable' && mayRetry) {
        return new Promise((r) => setTimeout(r, 400 + Math.random() * 800)).then(() => addOnce(body, false));
      }
      if (code === 'quota_exceeded') {
        document.getElementById('status').textContent = t('statusQuota');
        return null;
      }
      setMode('refused');
      return null;
    });
  }

  function cancelTyping(docId) {
    clearTimeout(textTimers.get(docId));
    textTimers.delete(docId);
  }

  function clearEditor(docId) {
    const el = cardEl(docId);
    if (el && !plainKeyEntry(docId)) el.querySelectorAll('textarea[data-form]').forEach((area) => { area.value = ''; });
  }

  function editorValue(el, docId) {
    const areas = [...el.querySelectorAll('textarea[data-form]')];
    if (!areas.length) return null;
    let value = areas[0].value;
    if (areas[0].dataset.form) {
      value = {};
      for (const area of areas) value[area.dataset.form] = area.value;
    }
    if (!textPresent(value)) return null;
    const plain = plainKeyEntry(docId);
    if (plain && matchesSlot(value, slotText(plain, rowLangOf(docId), [viewerId], docId))) return null;
    return value;
  }

  function matchesSlot(value, shown) {
    if (typeof value !== 'object') return slotPart(value, '') === slotPart(shown, '');
    return Object.keys(value).every((form) => slotPart(value, form) === slotPart(shown, form));
  }

  function flushCard(docId) {
    cancelTyping(docId);
    const el = cardEl(docId);
    const value = el ? editorValue(el, docId) : null;
    if (value !== null) save(docId, { pick: 'custom', text: value });
    else if (base(docId).pick === 'custom') save(docId, { pick: null, text: null });
    applyDoc(docId);
  }

  function flushPendingText() {
    for (const docId of [...textTimers.keys()]) flushCard(docId);
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPendingText(); });
  window.addEventListener('pagehide', flushPendingText);

  function onPick(docId, key) {
    cancelTyping(docId);
    clearEditor(docId);
    save(docId, { pick: key, text: null });
    applyDoc(docId);
  }

  function onUnpick(docId) {
    cancelTyping(docId);
    clearEditor(docId);
    save(docId, { pick: null, text: null });
    applyDoc(docId);
  }

  function onRestore(docId, form) {
    const area = form ? cardEl(docId).querySelector(`textarea[data-form="${CSS.escape(form)}"]`) : null;
    if (!area) {
      cancelTyping(docId);
      save(docId, { pick: null, text: null });
      applyDoc(docId);
      return;
    }
    area.value = slotPart(slotText(plainKeyEntry(docId), rowLangOf(docId), [viewerId], docId), form);
    flushCard(docId);
  }

  function tabFor(object) {
    if (object.startsWith('q.') || object.startsWith('note.')) return 'questions';
    if (object.startsWith('term.')) return 'terms';
    if (object.startsWith('review.')) return 'review';
    return 'keys';
  }

  function showKey(object) {
    const key = (keyEntryOf(object) || { key: object.slice(object.indexOf('.') + 1) }).key;
    Object.assign(keyFilter, { confidence: 'all', batch: 'all', flag: 'all', query: key.toLowerCase(), unreviewed: false, shown: PAGE_SIZE });
    document.getElementById('keys-search').value = key;
    document.getElementById('keys-unreviewed').checked = false;
    renderKeyFilters();
    renderKeys();
  }

  function objectTarget(object) {
    if (object.startsWith('review.')) return (reviewById.get(object.slice(7)) || {}).lang;
    return isKey(object) ? rowLangOf(object) : null;
  }

  function focusCardField(button) {
    const field = button.closest('.card').querySelector(`[data-doc="${CSS.escape(button.dataset.object)}"] textarea:not(:disabled)`);
    if (!field) return;
    field.scrollIntoView({ block: 'center' });
    field.focus({ preventScroll: true });
  }

  function goToObject(object, focus) {
    const tab = tabFor(object);
    if (TARGETS.includes(objectTarget(object))) selectTarget(objectTarget(object));
    if (tab === 'keys') showKey(object);
    selectTab(tab);
    const el = cardEl(object);
    if (!el) return;
    const card = el.closest('.card') || el;
    card.scrollIntoView({ block: 'center' });
    card.classList.add('is-target');
    setTimeout(() => card.classList.remove('is-target'), 1600);
    if (!focus) return;
    if (el.dataset.panelBody) openPanel(card, el.dataset.panelBody, true);
    const details = el.querySelector('details');
    if (details) details.open = true;
    const field = el.querySelector('textarea:not(:disabled)');
    if (field) field.focus({ preventScroll: true });
  }

  function togglePanel(button) {
    const card = button.closest('.card');
    openPanel(card, button.dataset.panel, card.querySelector(`[data-panel-body="${button.dataset.panel}"]`).hidden);
  }

  function confirmClear(button) {
    if (button.dataset.armed) {
      save(button.dataset.object, { pick: null, text: null, reviewed: false });
      return;
    }
    button.dataset.armed = '1';
    button.textContent = t('clearConfirm');
    setTimeout(() => {
      delete button.dataset.armed;
      button.textContent = t('clearMine');
    }, 4000);
  }

  function selectTab(tab) {
    activeTab = tab;
    document.querySelectorAll('nav.tabs [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    revealTab(document.querySelector(`nav.tabs [data-tab="${tab}"]`));
    document.querySelectorAll('main > .panel').forEach((p) => { p.hidden = p.id !== `panel-${tab}`; });
    if (tab === 'summary') renderSummary();
    try { history.replaceState(null, '', `#${tab}`); } catch (e) { /* the frame may refuse history writes */ }
  }

  const tabStrip = document.querySelector('nav.tabs .segmented');

  function revealTab(button) {
    const strip = tabStrip.getBoundingClientRect();
    const b = button.getBoundingClientRect();
    if (b.left >= strip.left && b.right <= strip.right) return;
    tabStrip.scrollLeft += b.left - strip.left - (strip.width - b.width) / 2;
  }

  function updateTabFade() {
    const max = tabStrip.scrollWidth - tabStrip.clientWidth;
    tabStrip.classList.toggle('fade-left', max > 4 && tabStrip.scrollLeft > 4);
    tabStrip.classList.toggle('fade-right', max > 4 && tabStrip.scrollLeft < max - 4);
  }

  function indexRound() {
    eventsByObject = new Map();
    latestByObject = new Map();
    for (const ev of allEvents.values()) {
      if (roundOf(ev) !== selectedRound) continue;
      if (!eventsByObject.has(ev.object)) eventsByObject.set(ev.object, []);
      eventsByObject.get(ev.object).push(ev);
      if (!latestByObject.has(ev.object)) latestByObject.set(ev.object, new Map());
      const byEditor = latestByObject.get(ev.object);
      const cur = byEditor.get(ev.by);
      if (!cur || String(ev.at) >= String(cur.at)) byEditor.set(ev.by, ev);
    }
  }

  function renderRound() {
    selectSnapshot(selectedRound);
    indexRound();
    renderBrief();
    renderQuestions();
    renderTerms();
    renderReview();
    renderKeyFilters();
    renderKeys();
    document.querySelectorAll('main [data-doc]').forEach((el) => applyDoc(el.dataset.doc));
    refreshCounts();
    updateWritable();
  }

  function selectRound(n) {
    if (n === selectedRound || !snapshots.has(n)) return;
    flushPendingText();
    selectedRound = n;
    keyFilter.shown = PAGE_SIZE;
    document.getElementById('close-panel').hidden = true;
    renderRound();
  }

  function editorStats(id) {
    let answers = 0;
    let disputes = 0;
    for (const [object, byEditor] of latestByObject) {
      const ev = byEditor.get(id);
      if (!ev || !hasAnswer(object, ev)) continue;
      answers += 1;
      if (isDiverged(object)) disputes += 1;
    }
    return { answers, disputes };
  }

  function roundEditors(counted = () => true) {
    const first = new Map();
    for (const [object, byEditor] of latestByObject) {
      if (!counted(object)) continue;
      for (const [id, ev] of byEditor) {
        if (!hasAnswer(object, ev)) continue;
        const at = String(ev.at);
        if (!first.has(id) || at < first.get(id)) first.set(id, at);
      }
    }
    return [...first.entries()].sort((a, b) => a[1].localeCompare(b[1])).map(([id]) => id);
  }

  function renderCloseOrder() {
    const last = closeOrder.length - 1;
    document.getElementById('close-order').innerHTML = closeOrder.length
      ? closeOrder.map((id, i) => `<li>
          <span class="rank">${i + 1}</span><span class="who">${esc(who(id))}</span>
          <span class="moves"><button class="link-btn" data-move="-1" data-index="${i}" aria-label="${esc(t('moveUp'))}"${i === 0 ? ' disabled' : ''}>↑</button><button class="link-btn" data-move="1" data-index="${i}" aria-label="${esc(t('moveDown'))}"${i === last ? ' disabled' : ''}>↓</button></span>
          ${orderLang === null ? `<span class="small muted stats">${esc(t('closeStats', editorStats(id)))}</span>` : ''}
        </li>`).join('')
      : `<li class="muted">${esc(t('closeNoEditors'))}</li>`;
  }

  function openOrderPanel(lang) {
    orderLang = lang;
    closeOrder = lang === null ? roundEditors() : exportEditors();
    const closing = lang === null;
    document.getElementById('close-title').textContent = t(closing ? 'closeTitle' : 'exportOrderTitle', { lang });
    document.getElementById('close-intro').textContent = t(closing ? 'closeIntro' : 'exportOrderIntro');
    document.getElementById('close-confirm').textContent = t(closing ? 'closeConfirm' : 'exportOrderConfirm');
    document.getElementById('close-note').textContent = '';
    const panel = document.getElementById('close-panel');
    panel.hidden = false;
    renderCloseOrder();
    if (!closing) panel.scrollIntoView({ block: 'center' });
  }

  const setsText = (object) => isKey(object) || isSourceDoc(object) || object.startsWith('review.');

  function exportEditors() {
    const ids = roundEditors(setsText);
    return ids.includes(viewerId) ? [viewerId, ...ids.filter((id) => id !== viewerId)] : ids;
  }

  function exportLangFile(lang) {
    flushPendingText();
    const ids = exportEditors();
    if (ids.length > 1) { openOrderPanel(lang); return; }
    saveLangFile(lang, ids);
  }

  function exportInOrder() {
    document.getElementById('close-panel').hidden = true;
    saveLangFile(orderLang, closeOrder);
  }

  async function closeRound() {
    if (!dbNs || !isOwner || !roundOpen(selectedRound)) return;
    flushPendingText();
    const n = selectedRound;
    const button = document.getElementById('close-confirm');
    const note = document.getElementById('close-note');
    button.disabled = true;
    note.textContent = t('closeSaving');
    const body = { closedAt: new Date().toISOString(), by: viewerId, priority: [...closeOrder] };
    try {
      await dbNs.doc(`rounds/${n}`).set(body);
      closedRounds.set(String(n), body);
      document.getElementById('close-panel').hidden = true;
      updateWritable();
    } catch (e) {
      note.textContent = e && e.code === 'invalid_argument' ? t('closeRefused') : t('closeFailed');
    } finally {
      button.disabled = false;
    }
  }

  function historyJson() {
    const events = [];
    for (const [object, list] of eventsByObject) {
      for (const ev of list) {
        events.push({ object, round: roundOf(ev), by: ev.by, editor: who(ev.by), at: ev.at, pick: ev.pick ?? null, text: ev.text ?? null, reviewed: ev.reviewed === true, answer: valueLabel(object, ev) });
      }
    }
    events.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const current = [...latestByObject.entries()].map(([object, byEditor]) => ({
      object,
      diverged: isDiverged(object),
      answers: [...byEditor.entries()].map(([id, ev]) => ({ by: id, editor: who(id), at: ev.at, pick: ev.pick ?? null, text: ev.text ?? null, reviewed: ev.reviewed === true, answer: valueLabel(object, ev) })),
    }));
    const editorList = [...editors.entries()].map(([id, e]) => ({ id, email: e.email || null, name: (people[id] && people[id].name) || e.name || '', firstSeenAt: e.firstSeenAt || null }));
    const closed = closedRounds.get(String(selectedRound)) || null;
    return JSON.stringify({ round: selectedRound, exportedAt: new Date().toISOString(), closed, editors: editorList, current, events }, null, 2);
  }

  function langFile(lang, order) {
    const out = {};
    for (const k of R.keys) out[k.key] = slotText(k, lang, order);
    return `${JSON.stringify(out, null, 2)}\n`;
  }

  const fileName = (suffix) => `${DATA.slug}-r${selectedRound}-${suffix}`;
  const saveLangFile = (lang, order) => saveFile(fileName(`${lang}.json`), langFile(lang, order));

  function exportNote(text) {
    const note = document.getElementById('export-note');
    if (note) note.textContent = text;
  }

  async function saveFile(filename, data) {
    if (!downloads) return;
    try {
      await downloads.save({ filename, data });
      exportNote('');
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') { exportNote(''); return; }
      if (code === 'rate_limited') { exportNote(t('exportBusy')); return; }
      if (code === 'extension_not_enabled') { exportNote(t('exportFormatOff')); return; }
      document.body.classList.remove('has-downloads');
    }
  }

  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxReady) {
      xlsxReady = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        script.onload = () => resolve(window.XLSX);
        script.onerror = () => { xlsxReady = null; reject(new Error('xlsx')); };
        document.head.appendChild(script);
      });
    }
    return xlsxReady;
  }

  const cellText = (v) => (v && typeof v === 'object' ? Object.entries(v).map(([form, text]) => `${form}: ${text}`).join('\n') : String(v ?? ''));

  function answeringEditors() {
    const ids = new Set();
    for (const byEditor of latestByObject.values()) for (const id of byEditor.keys()) ids.add(id);
    return [...ids];
  }

  function keysSheet() {
    const ids = answeringEditors();
    const pairs = ids.flatMap((id) => TARGETS.map((lang) => [id, lang]));
    const suffix = (lang) => (TARGETS.length > 1 ? ` · ${lang}` : '');
    const head = [t('colKey'), t('colBatch'), t('colConfidence'), SRC, ...TARGETS,
      ...pairs.flatMap(([id, lang]) => [t('colEditorAnswer', { editor: who(id) }) + suffix(lang), t('colEditorReviewed', { editor: who(id) }) + suffix(lang)])];
    const rows = R.keys.map((k) => {
      const answers = pairs.flatMap(([id, lang]) => {
        const object = keyDocOf(k, lang);
        const ev = latest(object).get(id);
        return [ev && hasAnswer(object, ev) ? valueLabel(object, ev) : '', ev && ev.reviewed === true ? t('yes') : ''];
      });
      const batch = batchById.get(k.batch);
      return [k.key, batch ? batch.label : k.batch || '', tMap('confidence', k.confidence), cellText(valueOf(k, SRC)), ...TARGETS.map((lang) => cellText(valueOf(k, lang))), ...answers];
    });
    return [head, ...rows];
  }

  function termsSheet() {
    const ids = answeringEditors();
    const head = [t('colTerm'), TARGETS[0], t('colMeaning'), t('colConfidence'), t('colVariants'), ...ids.map((id) => t('colEditorAnswer', { editor: who(id) }))];
    const rows = R.terms.map((x) => {
      const object = `term.${x.id}`;
      const byEditor = latest(object);
      const picks = ids.map((id) => {
        const ev = byEditor.get(id);
        return ev && hasAnswer(object, ev) ? valueLabel(object, ev) : '';
      });
      return [x.source, x.target || '', x.meaning || '', tMap('confidence', x.confidence), termOptions(x).filter((o) => !o.current).map((o) => o.text).join('\n'), ...picks];
    });
    return [head, ...rows];
  }

  const mdCell = (v) => String(v).replace(/\|/g, '\\|').replace(/\n/g, '<br>');

  function termsMarkdown() {
    const [head, ...rows] = termsSheet();
    const line = (cells) => `| ${cells.map(mdCell).join(' | ')} |`;
    return [line(head), line(head.map(() => '---')), ...rows.map(line)].join('\n') + '\n';
  }

  const SECTION_ORDER = ['q.', 'note.', 'term.', 'review.', 'key.', 'source.', 'comment.'];
  const SECTION_LABELS = { q: 'tabQuestions', note: 'notesSection', term: 'tabTerms', review: 'tabReview', key: 'tabKeys', source: 'sectionSource', comment: 'sectionKeyComments' };
  const sectionLabel = (object) => t(SECTION_LABELS[object.slice(0, object.indexOf('.'))]);
  const sectionRank = (object) => SECTION_ORDER.findIndex((p) => object.startsWith(p));

  function answerRow(object, id, ev) {
    return [sectionLabel(object), object.slice(object.indexOf('.') + 1), who(id), valueLabel(object, ev), ev.reviewed === true ? t('yes') : '', when(ev.at)];
  }

  function answerSheets() {
    const head = [t('colSection'), t('colItem'), t('colEditor'), t('colAnswer'), t('colReviewed'), t('colTime')];
    const current = [];
    const objects = [...latestByObject.keys()].sort((a, b) => sectionRank(a) - sectionRank(b) || a.localeCompare(b));
    for (const object of objects) {
      for (const [id, ev] of latestByObject.get(object)) if (hasAnswer(object, ev)) current.push(answerRow(object, id, ev));
    }
    const history = [];
    for (const [object, list] of eventsByObject) for (const ev of list) history.push({ at: String(ev.at), row: answerRow(object, ev.by, ev) });
    history.sort((a, b) => a.at.localeCompare(b.at));
    return [[t('sheetCurrent'), [head, ...current]], [t('sheetHistory'), [head, ...history.map((h) => h.row)]]];
  }

  async function exportXlsx() {
    if (!downloads) return;
    exportNote(t('exportPreparing'));
    let X;
    try {
      X = await loadXlsx();
    } catch (e) {
      exportNote(t('exportXlsxFailed'));
      return;
    }
    const sheets = [[t('sheetKeys'), keysSheet()], [t('sheetTerms'), termsSheet()], ...answerSheets()];
    const book = X.utils.book_new();
    for (const [name, rows] of sheets) X.utils.book_append_sheet(book, X.utils.aoa_to_sheet(rows), String(name).slice(0, 31));
    const data = new Uint8Array(X.write(book, { bookType: 'xlsx', type: 'array' }));
    await saveFile(fileName('answers.xlsx'), data);
  }

  const exportActions = {
    'export-brief': () => saveFile(fileName('brief.md'), String(R.brief || '')),
    'export-source': () => exportLangFile(SRC),
    'export-target': (lang) => exportLangFile(lang),
    'export-answers': () => saveFile(fileName('answers.json'), historyJson()),
    'export-xlsx': () => exportXlsx(),
    'export-terms': () => saveFile(fileName('terms.md'), termsMarkdown()),
  };

  document.querySelector('nav.tabs').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-tab]');
    if (b) selectTab(b.dataset.tab);
  });
  tabStrip.addEventListener('scroll', updateTabFade, { passive: true });
  window.addEventListener('resize', updateTabFade);

  document.getElementById('round-switch').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-round]');
    if (b) selectRound(Number(b.dataset.round));
  });

  document.getElementById('close-open').addEventListener('click', () => openOrderPanel(null));
  document.getElementById('close-cancel').addEventListener('click', () => { document.getElementById('close-panel').hidden = true; });
  document.getElementById('close-confirm').addEventListener('click', () => (orderLang === null ? closeRound() : exportInOrder()));
  document.getElementById('close-order').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-move]');
    if (!b) return;
    const i = Number(b.dataset.index);
    const j = i + Number(b.dataset.move);
    if (j < 0 || j >= closeOrder.length) return;
    [closeOrder[i], closeOrder[j]] = [closeOrder[j], closeOrder[i]];
    renderCloseOrder();
  });

  const main = document.getElementById('main');
  main.addEventListener('click', (ev) => {
    const proxy = ev.target.closest('[data-proxy-pick]');
    if (proxy && !proxy.disabled) { onPick(proxy.closest('[data-review-proxy]').dataset.reviewProxy, proxy.dataset.proxyPick); return; }
    const pick = ev.target.closest('[data-pick]');
    if (pick && !pick.disabled) { onPick(pick.closest('[data-doc]').dataset.doc, pick.dataset.pick); return; }
    const act = ev.target.closest('[data-act]');
    if (!act) return;
    const name = act.dataset.act;
    if (exportActions[name]) { exportActions[name](act.dataset.lang); return; }
    if (name === 'goto') { goToObject(act.dataset.object, false); return; }
    if (name === 'focus-field') { focusCardField(act); return; }
    if (name === 'edit') { goToObject(act.dataset.object, true); return; }
    if (name === 'open-term') { openedTerms.add(act.dataset.term); replaceTermCard(act.dataset.term); return; }
    if (name === 'close-term') { openedTerms.delete(act.dataset.term); replaceTermCard(act.dataset.term); return; }
    if (name === 'note-add') { openNoteForm(null); return; }
    if (name === 'note-edit') { openNoteForm(act.dataset.object); return; }
    if (name === 'note-save') { saveNote(); return; }
    if (name === 'note-cancel') { closeNoteForm(); return; }
    if (name === 'note-delete') { save(act.dataset.object, { pick: null, text: null }); return; }
    if (name === 'clear') { confirmClear(act); return; }
    if (name === 'toggle') { togglePanel(act); return; }
    const card = act.closest('[data-doc]');
    if (!card || !writable) return;
    if (name === 'custom') { const field = card.querySelector('textarea[data-form]'); if (field) field.focus(); return; }
    if (name === 'unpick') { onUnpick(card.dataset.doc); return; }
    if (name === 'restore') onRestore(card.dataset.doc, act.closest('[data-slot]').dataset.slot);
  });
  main.addEventListener('input', (ev) => {
    const area = ev.target;
    if (area.tagName !== 'TEXTAREA' || area.dataset.form === undefined || !writable) return;
    const el = area.closest('[data-doc]');
    if (!el) return;
    const docId = el.dataset.doc;
    clearTimeout(textTimers.get(docId));
    textTimers.set(docId, setTimeout(() => flushCard(docId), TEXT_DELAY_MS));
    applyPressed(el, docId);
    applyIssues(el, docId);
  });
  main.addEventListener('change', (ev) => {
    const target = ev.target;
    if (target.dataset.field === 'reviewed') { save(target.dataset.object, { reviewed: target.checked }); return; }
    const el = target.closest('[data-doc]');
    if (!el) return;
    if (target.tagName === 'TEXTAREA' && textTimers.has(el.dataset.doc)) flushCard(el.dataset.doc);
  });

  document.getElementById('keys-list').addEventListener('focusout', () => {
    if (keysRenderPending) setTimeout(renderKeysUnlessTyping);
  });
  document.getElementById('keys-search').addEventListener('input', (ev) => {
    keyFilter.query = ev.target.value.trim().toLowerCase();
    keyFilter.shown = PAGE_SIZE;
    renderKeys();
  });
  document.getElementById('review-search').addEventListener('input', (ev) => {
    reviewQuery = ev.target.value.trim().toLowerCase();
    renderReview();
    document.querySelectorAll('#review-list [data-doc]').forEach((el) => applyDoc(el.dataset.doc));
  });
  document.getElementById('review-langs').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-review-lang]');
    if (!b) return;
    reviewLang = b.dataset.reviewLang;
    storeReviewLang();
    renderReview();
    document.querySelectorAll('#review-list [data-doc]').forEach((el) => applyDoc(el.dataset.doc));
  });
  document.getElementById('keys-batch').addEventListener('change', (ev) => {
    keyFilter.batch = ev.target.value;
    keyFilter.shown = PAGE_SIZE;
    renderKeys();
  });
  document.getElementById('keys-flag').addEventListener('change', (ev) => {
    keyFilter.flag = ev.target.value;
    keyFilter.shown = PAGE_SIZE;
    renderKeys();
  });
  document.getElementById('keys-unreviewed').addEventListener('change', (ev) => {
    keyFilter.unreviewed = ev.target.checked;
    keyFilter.shown = PAGE_SIZE;
    renderKeys();
  });
  document.getElementById('keys-confidence').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-confidence]');
    if (!b) return;
    keyFilter.confidence = b.dataset.confidence;
    keyFilter.shown = PAGE_SIZE;
    document.querySelectorAll('#keys-confidence [data-confidence]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderKeys();
  });
  for (const id of PAIR_SWITCHES) {
    document.getElementById(id).addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-target]');
      if (b) selectTarget(b.dataset.target);
    });
  }
  document.getElementById('keys-more').addEventListener('click', () => {
    keyFilter.shown += PAGE_SIZE;
    renderKeys();
  });

  function onLog(snap) {
    const touched = new Set();
    for (const ch of snap.docChanges()) {
      const ev = ch.doc.data();
      if (!ev || typeof ev.object !== 'string' || typeof ev.by !== 'string') continue;
      if (ch.type === 'removed') allEvents.delete(ch.doc.id);
      else allEvents.set(ch.doc.id, ev);
      if (roundOf(ev) === selectedRound) touched.add(ev.object);
      if (awaiting.has(ch.doc.id)) { awaiting.delete(ch.doc.id); inflight.set(ev.object, Math.max(0, (inflight.get(ev.object) || 0) - 1)); }
    }
    const approvedTerms = [...touched].filter(isApprovedTermObject).map((object) => object.slice(5));
    const wasCollapsed = new Map(approvedTerms.map((id) => [id, isCollapsedTerm(termsById.get(id))]));
    indexRound();
    approvedTerms.filter((id) => wasCollapsed.get(id) !== isCollapsedTerm(termsById.get(id))).forEach(replaceTermCard);
    for (const object of touched) applyDoc(object);
    new Set([...touched].map(textKeyOf).filter(Boolean)).forEach(applyKeyTexts);
    if ([...touched].some((object) => object.startsWith('note.'))) renderNotes();
    if ([...touched].some((object) => object.startsWith('comment.'))) refreshCommentFilter();
    if (keyFilter.unreviewed && [...touched].some(isKey)) renderKeysUnlessTyping();
    refreshCounts();
    resolvePeople();
  }

  function textKeyOf(object) {
    if (object.startsWith('review.')) return (reviewById.get(object.slice(7)) || {}).key;
    return (keyEntryOf(object) || { key: null }).key;
  }

  function applyKeyTexts(key) {
    const e = keysById.get(key);
    if (e) TARGETS.forEach((lang) => applyDoc(keyDocOf(e, lang)));
    applyDoc(`source.${key}`);
    (reviewByKey.get(key) || []).forEach((r) => applyDoc(`review.${r.id}`));
    applyPhrases(key);
  }

  function refreshCommentFilter() {
    const filtered = keyFilter.flag === 'commented';
    renderKeyFilters();
    if (filtered) renderKeysUnlessTyping();
  }

  function renderKeysUnlessTyping() {
    if (isTypingInKeys()) { keysRenderPending = true; return; }
    keysRenderPending = false;
    renderKeys();
  }

  function isTypingInKeys() {
    const el = document.activeElement;
    return textTimers.size > 0 || (Boolean(el) && el.tagName === 'TEXTAREA' && Boolean(el.closest('#keys-list')));
  }

  function isApprovedTermObject(object) {
    return object.startsWith('term.') && Boolean((termsById.get(object.slice(5)) || {}).approved);
  }

  function onEditors(snap) {
    for (const ch of snap.docChanges()) {
      if (ch.type === 'removed') editors.delete(ch.doc.id);
      else editors.set(ch.doc.id, ch.doc.data() || {});
    }
    applyEmailForm();
    reapplyAll();
  }

  function onRounds(snap) {
    for (const ch of snap.docChanges()) {
      if (ch.type === 'removed') closedRounds.delete(ch.doc.id);
      else closedRounds.set(ch.doc.id, ch.doc.data() || {});
    }
    if (!roundOpen(selectedRound)) for (const docId of [...textTimers.keys()]) { cancelTyping(docId); applyDoc(docId); }
    updateWritable();
    if (activeTab === 'summary') renderSummary();
  }

  function applyEmailForm() {
    const form = document.getElementById('email-form');
    form.hidden = !writable;
    if (!writable) return;
    const saved = (editors.get(viewerId) || {}).email || '';
    const input = document.getElementById('email-input');
    if (input !== document.activeElement && !input.value) input.value = saved;
    form.toggleAttribute('data-missing', !saved);
    document.getElementById('email-note').textContent = saved ? t('emailSaved', { email: saved }) : t('emailMissing');
  }

  document.getElementById('email-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = document.getElementById('email-input');
    const email = input.value.trim();
    if (!writable || !dbNs || !viewerId || !input.checkValidity()) return;
    const note = document.getElementById('email-note');
    note.textContent = t('emailSaving');
    try {
      await ensureEditor();
      await dbNs.doc(`editors/${viewerId}`).update({ email });
    } catch (e) {
      note.textContent = t('emailFailed');
    }
  });

  function reapplyAll() {
    document.querySelectorAll('main [data-doc]').forEach((el) => applyEditors(el, el.dataset.doc));
    if (activeTab === 'summary') renderSummary();
    renderRoundBar();
    if (!document.getElementById('close-panel').hidden) renderCloseOrder();
  }

  async function resolvePeople() {
    if (!userNs) return;
    const ids = new Set(editors.keys());
    for (const m of latestByObject.values()) for (const id of m.keys()) ids.add(id);
    for (const c of closedRounds.values()) if (c.by) ids.add(c.by);
    if (![...ids].some((id) => !(id in people))) return;
    people = await userNs.profiles([...ids]);
    reapplyAll();
  }

  async function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { setMode('nodb'); return; }
    window.claude.use('downloads').then((ns) => {
      downloads = ns;
      document.body.classList.toggle('has-downloads', Boolean(ns));
    }).catch(() => {});
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    userNs = user;
    if (user) isOwner = (await user.isOwner()) === true;
    if (!db) { setMode('nodb'); return; }
    dbNs = db;
    if (user) viewerId = await user.id();
    logRef = db.collection('log');
    const lost = () => setMode('lost');
    db.collection('editors').onSnapshot(onEditors, () => {});
    db.collection('rounds').onSnapshot(onRounds, lost);
    logRef.onSnapshot(onLog, lost);
    if (!user || !viewerId) { setMode('read'); return; }
    const [canWrite, canEdit] = await Promise.all([user.can('data.write'), user.canEdit()]);
    setMode(canEdit === true && canWrite !== false ? 'write' : 'read');
  }

  buildSnapshots();
  renderHeader();
  renderRound();
  const initial = (location.hash || '').slice(1);
  if (TABS.includes(initial)) selectTab(initial);
  updateTabFade();
  connect().catch(() => setMode('nodb'));
})();
</script>
